<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .hint { font-size: 10px; opacity: 0.5; letter-spacing: 1px; margin-top: 6px; }
  .empty { text-align: center; padding: 30px; opacity: 0.5; letter-spacing: 2px; font-size: 12px; }

    .toggle { margin-left: 0; }

</style>

<body>
<header>
  <h1>◈ SCHEDULE & PHRASES EDITOR ◈</h1>
  <p class="sub">GESTIONE EVENTI E RISPOSTE VOCALI — DESK AVATAR</p>
</header>

<main>
  <section class="loader" id="loader">
    <p>Carica un file avatar HTML per iniziare</p>
    <label class="file-btn">
      <input type="file" accept=".html,.htm" id="fileInput" hidden>
      📁 SCEGLI FILE
    </label>
    <p class="hint">Il file deve contenere <code>SCHEDULED_EVENTS</code>, <code>VOICE_REPLIES</code> e <code>MIC_PHRASES</code></p>
  </section>

  <section id="editor" hidden>
    <div class="toolbar">
      <span class="filename" id="loadedName">—</span>
      <button id="reloadBtn">↻ Ricarica</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-target="sectionEvents">📅 Eventi Orari</button>
      <button class="tab-btn" data-target="sectionPhrases">💬 Frasi Casuali</button>
    </div>

    <div id="sectionEvents" class="editor-section active">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span class="subheading" style="margin: 0;">Lista Eventi Programmato</span>
        <button id="addEventBtn">+ Nuovo evento</button>
      </div>
      <div id="eventsList"></div>
    </div>

    <div id="sectionPhrases" class="editor-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span class="subheading" style="margin: 0;">Voice Replies (Risposte alla voce)</span>
        <button id="addVoiceBtn">+ Aggiungi risposta</button>
      </div>
      <div id="voiceList"></div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin: 24px 0 12px;">
        <span class="subheading" style="margin: 0;">Mic Phrases (Reazioni a rumori secchi)</span>
        <button id="addMicBtn">+ Aggiungi reazione</button>
      </div>
      <div id="micList"></div>
    </div>

    <div class="output">
      <label for="filenameInput">SALVA COME:</label>
      <input type="text" id="filenameInput" value="index02.html">
      <button id="generateBtn">💾 GENERA FILE</button>
    </div>
  </section>
</main>

<script>
// ============================================================
// STATE
// ============================================================
let currentHtml = '';
let currentFilename = '';
let events = [];
let voiceReplies = [];
let micPhrases = [];

// ============================================================
// SPEECH SYNTHESIS HELPER
// ============================================================
function speakText(text, volume = 'normal') {
  if (!('speechSynthesis' in window)) {
    alert('La sintesi vocale non è supportata da questo browser.');
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'it-IT';
  utterance.volume = (volume === 'low') ? 0.35 : 1.0;
  const voices = window.speechSynthesis.getVoices();
  const italianVoice = voices.find(v => v.lang.startsWith('it'));
  if (italianVoice) utterance.voice = italianVoice;
  window.speechSynthesis.speak(utterance);
}

function playSequence(sequenceLines, volume = 'normal') {
  if (!Array.isArray(sequenceLines) || sequenceLines.length === 0) return;
  const validLines = sequenceLines.filter(l => l && l.trim().length > 0);
  if (validLines.length === 0) return;
  if (!('speechSynthesis' in window)) {
    alert('La sintesi vocale non è supportata da questo browser.');
    return;
  }
  window.speechSynthesis.cancel();
  const voices = window.speechSynthesis.getVoices();
  const italianVoice = voices.find(v => v.lang.startsWith('it'));
  validLines.forEach(line => {
    const utterance = new SpeechSynthesisUtterance(line);
    utterance.lang = 'it-IT';
    utterance.volume = (volume === 'low') ? 0.35 : 1.0;
    if (italianVoice) utterance.voice = italianVoice;
    window.speechSynthesis.speak(utterance);
  });
}

// ============================================================
// DOM
// ============================================================
const fileInput = document.getElementById('fileInput');
const loader = document.getElementById('loader');
const editor = document.getElementById('editor');
const loadedName = document.getElementById('loadedName');
const filenameInput = document.getElementById('filenameInput');
const generateBtn = document.getElementById('generateBtn');
const reloadBtn = document.getElementById('reloadBtn');

const eventsList = document.getElementById('eventsList');
const voiceList = document.getElementById('voiceList');
const micList = document.getElementById('micList');
const addEventBtn = document.getElementById('addEventBtn');
const addVoiceBtn = document.getElementById('addVoiceBtn');
const addMicBtn = document.getElementById('addMicBtn');

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.editor-section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.target).classList.add('active');
  });
});

// ============================================================
// FILE LOADING
// ============================================================
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const parsedEvents = parseArrayFromHtml(text, 'SCHEDULED_EVENTS');
    const parsedVoice = parseArrayFromHtml(text, 'VOICE_REPLIES');
    const parsedMic = parseArrayFromHtml(text, 'MIC_PHRASES');

    if (!parsedEvents) {
      alert("Non ho trovato 'SCHEDULED_EVENTS' nel file.\nAssicurati che sia un avatar HTML valido.");
      return;
    }

    currentHtml = text;
    currentFilename = file.name;
    events = parsedEvents;
    voiceReplies = parsedVoice || [];
    micPhrases = parsedMic || [];

    loadedName.textContent = '📄 ' + file.name;
    suggestFilename();
    renderAll();
    loader.hidden = true;
    editor.hidden = false;
  } catch (err) {
    alert('Errore di lettura: ' + err.message);
  }
  fileInput.value = '';
});

reloadBtn.addEventListener('click', () => fileInput.click());

// ============================================================
// PARSER (bracket matching generico)
// ============================================================
function findArrayBounds(html, marker) {
  const idx = html.indexOf(marker);
  if (idx === -1) return null;

  const openBracket = html.indexOf('[', idx);
  if (openBracket === -1) return null;

  let depth = 0;
  let inString = false, stringChar = '';
  let inLineComment = false, inBlockComment = false;

  for (let i = openBracket; i < html.length; i++) {
    const c = html[i];
    const next = html[i + 1];

    if (inLineComment) { if (c === '\n') inLineComment = false; continue; }
    if (inBlockComment) { if (c === '*' && next === '/') { inBlockComment = false; i++; } continue; }
    if (inString) {
      if (c === '\\') { i++; continue; }
      if (c === stringChar) inString = false;
      continue;
    }
    if (c === '/' && next === '/') { inLineComment = true; i++; continue; }
    if (c === '/' && next === '*') { inBlockComment = true; i++; continue; }
    if (c === '"' || c === "'" || c === '`') { inString = true; stringChar = c; continue; }

    if (c === '[') depth++;
    else if (c === ']') {
      depth--;
      if (depth === 0) return { open: openBracket, close: i };
    }
  }
  return null;
}

function parseArrayFromHtml(html, marker) {
  const bounds = findArrayBounds(html, marker);
  if (!bounds) return null;
  const arrStr = html.slice(bounds.open, bounds.close + 1);
  try {
    const fn = new Function('return ' + arrStr);
    const arr = fn();
    return Array.isArray(arr) ? arr : null;
  } catch (err) {
    console.error(err);
    return null;
  }
}

// ============================================================
// FILENAME SUGGESTION
// ============================================================
function suggestFilename() {
  const m = currentFilename.match(/^index(\d+)\.html?$/i);
  if (m) {
    const num = parseInt(m[1], 10);
    filenameInput.value = 'index' + String(num + 1).padStart(2, '0') + '.html';
  } else if (/^index\.html?$/i.test(currentFilename)) {
    filenameInput.value = 'index02.html';
  } else {
    filenameInput.value = 'index02.html';
  }
}

// ============================================================
// RENDER
// ============================================================
function escapeAttr(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderAll() {
  renderEvents();
  renderPhrases('voice', voiceReplies, voiceList);
  renderPhrases('mic', micPhrases, micList);
}

function renderEvents() {
  eventsList.innerHTML = '';
  if (events.length === 0) {
    eventsList.innerHTML = '<p class="empty">NESSUN EVENTO — AGGIUNGINE UNO</p>';
    return;
  }

  events.forEach((ev, i) => {
    const card = document.createElement('div');
    card.className = 'event-card' + (ev.active === false ? ' inactive' : '');

    const hh = String(ev.h ?? 0).padStart(2, '0');
    const mm = String(ev.m ?? 0).padStart(2, '0');
    const isSeq = Array.isArray(ev.sequence);
    const vol = ev.volume === 'low' ? 'low' : 'normal';

    const seqText = isSeq ? ev.sequence.join('\n') : '';
    const textVal = !isSeq ? (ev.text || '') : '';

    card.innerHTML = `
      <div class="row top">
        <input type="time" class="time-input" data-idx="${i}" value="${hh}:${mm}">
        <select class="type-input" data-idx="${i}">
          <option value="text"${!isSeq ? ' selected' : ''}>Frase singola</option>
          <option value="sequence"${isSeq ? ' selected' : ''}>Sequenza</option>
        </select>
        <select class="volume-input" data-idx="${i}">
          <option value="normal"${vol === 'normal' ? ' selected' : ''}>Voce normale</option>
          <option value="low"${vol === 'low' ? ' selected' : ''}>Sottovoce</option>
        </select>
        <label class="toggle">
          <input type="checkbox" class="active-input" data-idx="${i}"${ev.active !== false ? ' checked' : ''}>
          <span>ATTIVO</span>
        </label>
        <button class="test-btn event-test" data-idx="${i}" title="Prova sintesi vocale">▶ Prova</button>
        <button class="delete-btn event-del" data-idx="${i}" title="Elimina">🗑</button>
      </div>
      <div class="content">
        ${isSeq
          ? `<textarea class="seq-input" data-idx="${i}" rows="${Math.max(3, ev.sequence.length)}">${escapeAttr(seqText)}<\/textarea>
             <p class="hint">Una riga = una frase. Riga vuota = pausa breve.</p>`
          : `<input type="text" class="text-input" data-idx="${i}" value="${escapeAttr(textVal)}" placeholder="Testo della frase...">
             <p class="hint">Frase unica detta in una volta.</p>`
        }
      </div>
    `;
    eventsList.appendChild(card);
  });
  attachEventListeners();
}

function renderPhrases(type, arr, container) {
  container.innerHTML = '';
  if (arr.length === 0) {
    container.innerHTML = '<p class="empty">NESSUNA FRASE PRESENTE</p>';
    return;
  }

  arr.forEach((phrase, i) => {
    const card = document.createElement('div');
    card.className = 'phrase-card';
    card.innerHTML = `
      <input type="text" class="phrase-input" data-type="${type}" data-idx="${i}" value="${escapeAttr(phrase)}">
      <button class="test-btn phrase-test" data-type="${type}" data-idx="${i}" title="Prova sintesi vocale">▶ Prova</button>
      <button class="delete-btn phrase-del" data-type="${type}" data-idx="${i}" title="Elimina">🗑</button>
    `;
    container.appendChild(card);
  });
  attachPhraseListeners();
}

// ============================================================
// EVENT LISTENERS
// ============================================================
function attachEventListeners() {
  eventsList.querySelectorAll('.time-input').forEach(el => {
    el.addEventListener('change', e => {
      const [h, m] = e.target.value.split(':').map(Number);
      const idx = parseInt(e.target.dataset.idx, 10);
      events[idx].h = h;
      events[idx].m = m;
    });
  });

  eventsList.querySelectorAll('.type-input').forEach(el => {
    el.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      const ev = events[idx];
      if (e.target.value === 'sequence') {
        if (!Array.isArray(ev.sequence)) {
          ev.sequence = ev.text ? [ev.text] : [''];
          delete ev.text;
        }
      } else {
        if (Array.isArray(ev.sequence)) {
          ev.text = ev.sequence.find(s => s && s.trim()) || '';
          delete ev.sequence;
        }
      }
      renderEvents();
    });
  });

  eventsList.querySelectorAll('.volume-input').forEach(el => {
    el.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      events[idx].volume = e.target.value;
    });
  });

  eventsList.querySelectorAll('.active-input').forEach(el => {
    el.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      events[idx].active = e.target.checked;
      e.target.closest('.event-card').classList.toggle('inactive', !e.target.checked);
    });
  });

  eventsList.querySelectorAll('.event-test').forEach(el => {
    el.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      const ev = events[idx];
      const vol = ev.volume || 'normal';
      if (Array.isArray(ev.sequence)) {
        playSequence(ev.sequence, vol);
      } else {
        speakText(ev.text || '', vol);
      }
    });
  });

  eventsList.querySelectorAll('.event-del').forEach(el => {
    el.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      const card = e.target.closest('.event-card');
      if (confirm('Eliminare questo evento?')) {
        card.style.transition = 'all 0.2s';
        card.style.opacity = '0';
        card.style.transform = 'translateX(-20px)';
        setTimeout(() => {
          events.splice(idx, 1);
          renderEvents();
        }, 180);
      }
    });
  });

  eventsList.querySelectorAll('.text-input').forEach(el => {
    el.addEventListener('input', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      events[idx].text = e.target.value;
    });
  });

  eventsList.querySelectorAll('.seq-input').forEach(el => {
    el.addEventListener('input', e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      events[idx].sequence = e.target.value.split('\n');
    });
  });
}

function attachPhraseListeners() {
  document.querySelectorAll('.phrase-input').forEach(el => {
    el.addEventListener('input', e => {
      const type = e.target.dataset.type;
      const idx = parseInt(e.target.dataset.idx, 10);
      if (type === 'voice') voiceReplies[idx] = e.target.value;
      if (type === 'mic') micPhrases[idx] = e.target.value;
    });
  });

  document.querySelectorAll('.phrase-test').forEach(el => {
    el.addEventListener('click', e => {
      const type = e.target.dataset.type;
      const idx = parseInt(e.target.dataset.idx, 10);
      const text = (type === 'voice') ? voiceReplies[idx] : micPhrases[idx];
      speakText(text || '', 'normal');
    });
  });

  document.querySelectorAll('.phrase-del').forEach(el => {
    el.addEventListener('click', e => {
      const type = e.target.dataset.type;
      const idx = parseInt(e.target.dataset.idx, 10);
      if (confirm('Eliminare questa frase?')) {
        if (type === 'voice') voiceReplies.splice(idx, 1);
        if (type === 'mic') micPhrases.splice(idx, 1);
        renderAll();
      }
    });
  });
}

addEventBtn.addEventListener('click', () => {
  const now = new Date();
  let h = now.getHours();
  let m = now.getMinutes() + 5;
  if (m >= 60) { m -= 60; h = (h + 1) % 24; }

  events.push({ h, m, text: 'nuovo messaggio' });
  renderEvents();
  const last = eventsList.lastElementChild;

// ============================================================
// SERIALIZE ARRAYS
// ============================================================
function serializeEvents() {
  if (events.length === 0) return '[]';
  let out = '[\n';
  events.forEach(ev => {
    out += '  {\n';
    out += `    h: ${ev.h}, m: ${ev.m},\n`;
    if (ev.active === false) out += `    active: false,\n`;
    if (ev.volume === 'low') out += `    volume: 'low',\n`;
    if (Array.isArray(ev.sequence)) {
      out += `    sequence: [\n`;
      ev.sequence.forEach(line => {
        out += `      ${JSON.stringify(line)},\n`;
      });
      out += `    ]\n`;
    } else {
      out += `    text: ${JSON.stringify(ev.text || '')}\n`;
    }
    out += '  },\n';
  });
  out += ']';
  return out;
}

function serializeStringArray(arr) {
  if (arr.length === 0) return '[]';
  return '[\n  ' + arr.map(s => JSON.stringify(s)).join(',\n  ') + '\n]';
}

// ============================================================
// GENERATE FILE
// ============================================================
function buildNewHtml(baseHtml) {
  let html = baseHtml || currentHtml;

  const bEvents = findArrayBounds(html, 'SCHEDULED_EVENTS');
  if (bEvents) {
    html = html.slice(0, bEvents.open) + serializeEvents() + html.slice(bEvents.close + 1);
  }

  const bVoice = findArrayBounds(html, 'VOICE_REPLIES');
  if (bVoice) {
    html = html.slice(0, bVoice.open) + serializeStringArray(voiceReplies) + html.slice(bVoice.close + 1);
  }

  const bMic = findArrayBounds(html, 'MIC_PHRASES');
  if (bMic) {
    html = html.slice(0, bMic.open) + serializeStringArray(micPhrases) + html.slice(bMic.close + 1);
  }

  return html;
}

generateBtn.addEventListener('click', async () => {
  try {
    const newHtml = buildNewHtml();
    const filename = (filenameInput.value.trim() || 'index02.html');

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(newHtml);
        await writable.close();
        flash('✅ FILE SALVATO');
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
        console.warn('showSaveFilePicker failed, falling back', err);
      }
    }

    const blob = new Blob([newHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    flash('✅ FILE SCARICATO');
  } catch (err) {
    alert('Errore: ' + err.message);
  }
});

// ============================================================
// FLASH
// ============================================================
function flash(msg) {
  const el = document.createElement('div');
  el.className = 'flash';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 350);
  }, 2000);
}
</script>

// --- PURE ---
function blockBounds(html, name) {
  const start = html.indexOf('const ' + name + ' = {');
  if (start === -1) return null;
  const end = html.indexOf('\n};', start);
  if (end === -1) return null;
  return { start, end };
}
function readNumber(html, field) {
  const b = blockBounds(html, field.block);
  if (!b) return null;
  const m = new RegExp('\\b' + field.key + ':\\s*(-?\\d*\\.?\\d+)').exec(html.slice(b.start, b.end));
  return m ? parseFloat(m[1]) : null;
}
function writeNumber(html, field, value) {
  const b = blockBounds(html, field.block);
  if (!b) return html;
  const re = new RegExp('(\\b' + field.key + ':\\s*)(-?\\d*\\.?\\d+)');
  const text = html.slice(b.start, b.end);
  if (!re.test(text)) return html;
  const num = String(parseFloat(Number(value).toFixed(4)));
  return html.slice(0, b.start) + text.replace(re, '$1' + num) + html.slice(b.end);
}
function readEnabled(html) {
  const b = blockBounds(html, 'AUDIO_CONFIG');
  if (!b) return null;
  const m = /\benabled:\s*(true|false)/.exec(html.slice(b.start, b.end));
  return m ? m[1] === 'true' : null;
}
function writeEnabled(html, value) {
  const b = blockBounds(html, 'AUDIO_CONFIG');
  if (!b) return html;
  const text = html.slice(b.start, b.end);
  if (!/\benabled:\s*(true|false)/.test(text)) return html;
  return html.slice(0, b.start) + text.replace(/(\benabled:\s*)(true|false)/, '$1' + (value ? 'true' : 'false')) + html.slice(b.end);
}
// --- /PURE ---

// ============================================================
// STATO
// ============================================================
let currentHtml = '';
let currentFilename = '';
let values = {};
let originals = {};
let enabled = true, originalEnabled = true, hasEnabled = false;

const fileInput = document.getElementById('fileInput');
const loader = document.getElementById('loader');
const editor = document.getElementById('editor');
const fieldsList = document.getElementById('fieldsList');
const loadedName = document.getElementById('loadedName');
const filenameInput = document.getElementById('filenameInput');
const generateBtn = document.getElementById('generateBtn');
const reloadBtn = document.getElementById('reloadBtn');
const resetAllBtn = document.getElementById('resetAllBtn');

// ============================================================
// CARICAMENTO FILE
// ============================================================
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const found = {};
    FIELDS.forEach(f => { const v = readNumber(text, f); if (v !== null) found[f.key] = v; });
    if (Object.keys(found).length === 0) {
      alert("Non ho trovato 'const AUDIO_CONFIG = {...}' con i volumi nel file.\nAssicurati che sia un avatar HTML valido.");
      return;
    }
    currentHtml = text;
    currentFilename = file.name;
    originals = { ...found };
    values = { ...found };
    const en = readEnabled(text);
    hasEnabled = en !== null;
    enabled = originalEnabled = en !== null ? en : true;
    loadedName.textContent = '📄 ' + file.name;
    suggestFilename();
    render();
    loader.hidden = true;
    editor.hidden = false;
  } catch (err) {
    alert('Errore di lettura: ' + err.message);
  }
  fileInput.value = '';
});
reloadBtn.addEventListener('click', () => fileInput.click());
resetAllBtn.addEventListener('click', () => {
  values = { ...originals };
  enabled = originalEnabled;
  render();
});

function suggestFilename() {
  const m = currentFilename.match(/^index(\d+)\.html?$/i);
  filenameInput.value = m ? 'index' + String(parseInt(m[1], 10) + 1).padStart(2, '0') + '.html' : 'index02.html';
}

// ============================================================
// RENDER
// ============================================================
function fmt(v) { return String(parseFloat(Number(v).toFixed(4))); }

function render() {
  fieldsList.innerHTML = '';

  GROUPS.forEach(g => {
    const fields = FIELDS.filter(f => f.group === g.id && f.key in values);
    if (!fields.length && !(g.id === 'sound' && hasEnabled)) return;

    const title = document.createElement('p');
    title.className = 'group-title';
    title.textContent = g.title;
    fieldsList.appendChild(title);

    if (g.id === 'micVoice') {
      const pc = document.createElement('div');
      pc.className = 'card';
      pc.innerHTML = `
        <div class="card-head"><span class="card-title">Profili di reattività</span></div>
        <p class="desc">Impostano insieme tutte le soglie del microfono (sia voce sia colpi). Dopo averne scelto uno puoi ritoccare i singoli valori qui sotto. I volumi non vengono toccati.</p>
        <div class="presets"></div>`;
      const box = pc.querySelector('.presets');
      PRESETS.forEach(p => {
        const b = document.createElement('button');
        b.innerHTML = p.label + '<small>' + p.hint + '</small>';
        b.addEventListener('click', () => {
          Object.keys(p.values).forEach(k => { if (k in values) values[k] = p.values[k]; });
          render();
          flash('PROFILO: ' + p.label.toUpperCase());
        });
        box.appendChild(b);
      });
      fieldsList.appendChild(pc);
    }

    if (g.id === 'sound' && hasEnabled) {
      const card = document.createElement('div');
      card.className = 'card' + (enabled !== originalEnabled ? ' changed' : '');
      card.innerHTML = `
        <div class="card-head"><span class="card-title">Suoni elettronici</span></div>
        <p class="desc">Interruttore generale di saluto e sbadiglio. Non riguarda la voce.</p>
        <label class="toggle"><input type="checkbox" id="enabledChk"${enabled ? ' checked' : ''}><span>${enabled ? 'ATTIVI' : 'DISATTIVATI'}</span></label>`;
      fieldsList.appendChild(card);
      card.querySelector('#enabledChk').addEventListener('change', e => {
        enabled = e.target.checked;
        render();
      });
    }

    fields.forEach(f => {
      const v = values[f.key];
      const max = Math.max(f.max, v);
      const min = Math.min(f.min || 0, v);
      const hasPlay = f.kind !== 'mic';
      const card = document.createElement('div');
      card.className = 'card' + (v !== originals[f.key] ? ' changed' : '');
      card.innerHTML = `
        <div class="card-head">
          <span class="card-title">${f.label}</span>
          <span class="orig">${f.key} · originale ${fmt(originals[f.key])}</span>
        </div>
        <p class="desc">${f.desc}</p>
        <div class="row">
          <input type="range" min="${min}" max="${max}" step="${f.step}" value="${v}">
          <input type="number" min="${min}" max="${max}" step="${f.step}" value="${fmt(v)}">
          ${f.unit ? '<span class="unit">' + f.unit + '</span>' : ''}
          ${hasPlay ? '<button class="play-btn">▶ Prova</button>' : ''}
          <button class="reset-btn" title="Ripristina il valore originale">⟲</button>
        </div>`;
      fieldsList.appendChild(card);

      const range = card.querySelector('input[type=range]');
      const num = card.querySelector('input[type=number]');
      const setVal = (nv) => {
        nv = Math.max(min, Math.min(max, parseFloat(nv)));
        if (isNaN(nv)) return;
        values[f.key] = nv;
        card.classList.toggle('changed', nv !== originals[f.key]);
      };
      range.addEventListener('input', () => { setVal(range.value); num.value = fmt(values[f.key]); });
      num.addEventListener('change', () => { setVal(num.value); range.value = values[f.key]; num.value = fmt(values[f.key]); });
      if (hasPlay) card.querySelector('.play-btn').addEventListener('click', () => preview(f, values[f.key]));
      card.querySelector('.reset-btn').addEventListener('click', () => { values[f.key] = originals[f.key]; render(); });
    });
  });
}

// ============================================================
// ANTEPRIMA AUDIO
// ============================================================
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, duration, volume, type, freqEnd) {
  const ac = ensureAudio(); if (!ac) return;
  const t = ac.currentTime;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, t + duration);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(volume, t + 0.03);
  gain.gain.linearRampToValueAtTime(0, t + duration);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(t); osc.stop(t + duration + 0.05);
}
function playGreet(v) {
  tone(440, 0.07, v, 'sine');
  setTimeout(() => tone(660, 0.07, v, 'sine'), 80);
  setTimeout(() => tone(880, 0.13, v, 'sine', 820), 160);
}
function playChirp(v) {
  tone(720, 0.09, v, 'sine', 620);
  setTimeout(() => tone(560, 0.12, v, 'sine', 480), 95);
}
function playYawn(v) {
  const ac = ensureAudio(); if (!ac) return;
  const t = ac.currentTime;
  const osc = ac.createOscillator(), gain = ac.createGain(), filter = ac.createBiquadFilter();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.linearRampToValueAtTime(300, t + 0.45);
  osc.frequency.linearRampToValueAtTime(160, t + 1.0);
  filter.type = 'lowpass'; filter.frequency.value = 480;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(v, t + 0.25);
  gain.gain.linearRampToValueAtTime(0, t + 1.0);
  osc.connect(filter); filter.connect(gain); gain.connect(ac.destination);
  osc.start(t); osc.stop(t + 1.05);
}
function speak(text, volume) {
  if (!('speechSynthesis' in window)) { flash('⚠ VOCE NON SUPPORTATA'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'it-IT'; u.rate = 0.95; u.pitch = 1.05; u.volume = Math.max(0, Math.min(1, volume));
  const voices = speechSynthesis.getVoices();
  const v = voices.find(x => x.lang === 'it-IT') || voices.find(x => x.lang && x.lang.startsWith('it'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function preview(f, v) {
  if (f.kind === 'speech') speak(f.sample, v);
  else if (f.kind === 'greet') playGreet(v);
  else if (f.kind === 'yawn') playYawn(v);
  else if (f.kind === 'chirp') playChirp(v);
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();

// ============================================================
// GENERA FILE
// ============================================================
function buildNewHtml(baseHtml) {
  let out = baseHtml || currentHtml;
  FIELDS.forEach(f => { if (f.key in values) out = writeNumber(out, f, values[f.key]); });
  if (hasEnabled) out = writeEnabled(out, enabled);
  return out;
}

generateBtn.addEventListener('click', async () => {
  try {
    const newHtml = buildNewHtml();
    const filename = filenameInput.value.trim() || 'index02.html';

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(newHtml);
        await writable.close();
        flash('✅ FILE SALVATO');
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
        console.warn('showSaveFilePicker fallito, uso il download', err);
      }
    }

    const blob = new Blob([newHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    flash('✅ FILE SCARICATO');
  } catch (err) {
    alert('Errore: ' + err.message);
  }
});

function flash(msg) {
  const el = document.createElement('div');
  el.className = 'flash';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 350); }, 2000);
}
</script>

<script>
window.loadSharedAvatar = async function(name, text) {
  const input = document.getElementById('fileInput');
  const file = new File([text], name, { type: 'text/html' });
  const dt = new DataTransfer();
  dt.items.add(file);
  input.files = dt.files;
  input.dispatchEvent(new Event('change', { bubbles: true }));
  await new Promise(r => setTimeout(r, 0));
};
</script>

  }
  .pdf-options label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .pdf-options input[type="checkbox"] { accent-color: #00ff88; cursor: pointer; }
  .pdf-options input[type="number"] {
    width: 100px; background: rgba(0,0,0,0.4); color: #00ff88;
    border: 1px solid rgba(0,255,157,0.3); border-radius: 6px;
    padding: 6px 8px; font-family: inherit; font-size: 12px; outline: none;
  }
  .pdf-options input[type="number"]:focus { border-color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.35); }
  .pdf-options .hint { font-size: 10px; opacity: 0.55; letter-spacing: 0.5px; }
  .pdf-options.disabled { opacity: 0.45; pointer-events: none; }

  .char-count { font-size: 10px; opacity: 0.6; letter-spacing: 1px; margin-top: 8px; }
  .char-count.warn { color: #ffcc44; opacity: 0.9; }

  .output {
    margin-top: 20px; padding: 20px; border: 1px solid rgba(0,255,157,0.3); border-radius: 10px;
    background: rgba(0,255,157,0.05); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between;
  }
  #generateBtn { background: rgba(0,255,136,0.15); border-color: #00ff88; padding: 12px 24px; font-size: 13px; width: 100%; }
  #generateBtn:hover { background: rgba(0,255,136,0.28); box-shadow: 0 0 22px rgba(0,255,136,0.5); }

  .flash {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(0,30,15,0.95); color: #00ff88; padding: 12px 28px; border: 1px solid #00ff88; border-radius: 8px;
    font-size: 13px; letter-spacing: 2px; box-shadow: 0 0 30px rgba(0,255,136,0.4); opacity: 0; transition: all 0.3s;
    pointer-events: none; z-index: 9999;
  }
  .flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>◈ AUDIO SOURCE EDITOR ◈</h1>
  <p class="sub">GESTIONE TESTO LETTURA AVATAR — <code>audio_sourge.js</code></p>
</header>

<main>
  <section class="loader" id="loaderSection">
    <p>Seleziona un file esistente o parti da zero</p>
    <label class="file-btn">
      <input type="file" accept=".txt,.js,.mjs,.pdf" id="fileInput" hidden>
      📁 APRI FILE (.TXT, .JS, .PDF)
    </label>
    <p class="hint">Oppure <a href="#" id="skipLink" style="color: #00ffaa; text-decoration: underline; cursor: pointer;">scrivi direttamente da zero</a></p>
  </section>

  <section id="editorSection" hidden>
    <div class="toolbar">
      <span class="filename" id="loadedName">📄 Nuovo testo</span>
      <button id="clearBtn">🗑 Pulisci</button>
      <button id="reloadLoaderBtn">📁 Apri altro file</button>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">TESTO LETTO DALL'AVATAR (Tasto L)</span>
      </div>
      <p class="desc">
        Modifica liberamente il testo. Puoi importare anche un PDF: il testo verrà estratto automaticamente. Punteggiatura e spaziatura normale verranno gestite al momento del salvataggio nel formato corretto.
      </p>

      <div class="pdf-options" id="pdfOptions">
        <label>
          <input type="checkbox" id="truncatePdf">
          <span>Tronca PDF a</span>
        </label>
        <input type="number" id="truncateLimit" value="200000" min="1000" step="1000">
        <span>caratteri</span>
        <span class="hint">(spento = testo integrale. Consigliato se usi Groq)</span>
      </div>

      <textarea id="textArea" placeholder="Scrivi o incolla qui il testo..."><\/textarea>
      <div class="char-count" id="charCount">0 caratteri</div>
    </div>

    <div class="output">
      <button id="generateBtn">💾 ESPORTA COME <code>audio_sourge.js</code></button>
    </div>
  </section>
</main>

<script>
const loaderSection = document.getElementById('loaderSection');
const editorSection = document.getElementById('editorSection');
const fileInput = document.getElementById('fileInput');
const skipLink = document.getElementById('skipLink');
const reloadLoaderBtn = document.getElementById('reloadLoaderBtn');
const clearBtn = document.getElementById('clearBtn');
const textArea = document.getElementById('textArea');
const loadedName = document.getElementById('loadedName');
const generateBtn = document.getElementById('generateBtn');
const charCount = document.getElementById('charCount');
const pdfOptions = document.getElementById('pdfOptions');
const truncatePdf = document.getElementById('truncatePdf');
const truncateLimit = document.getElementById('truncateLimit');

// Aggiorna contatore caratteri e stato del riquadro PDF
function updateCharCount() {
  const n = textArea.value.length;
  charCount.textContent = n.toLocaleString('it-IT') + ' caratteri';
  const limit = parseInt(truncateLimit.value, 10) || 200000;
  charCount.classList.toggle('warn', n > limit);
}

textArea.addEventListener('input', updateCharCount);
truncateLimit.addEventListener('input', updateCharCount);

// Abilita/disabilita il campo numerico in base alla checkbox
function syncPdfOptionsState() {
  pdfOptions.classList.toggle('disabled', !truncatePdf.checked);
}
truncatePdf.addEventListener('change', syncPdfOptionsState);
syncPdfOptionsState();

// ============================================================
// PDF.JS — caricamento lazy da CDN (pinnato)
// ============================================================
const PDFJS_CDN = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs';
const PDFJS_WORKER_CDN = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';
let pdfjsLib = null;
let pdfjsLoading = null;

async function ensurePdfJs() {
  if (pdfjsLib) return pdfjsLib;
  if (pdfjsLoading) return pdfjsLoading;
  pdfjsLoading = (async () => {
    try {
      const mod = await import(PDFJS_CDN);
      mod.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_CDN;
      pdfjsLib = mod;
      return mod;
    } catch (err) {
      pdfjsLoading = null;
      throw new Error('Impossibile caricare pdf.js: ' + err.message);
    }
  })();
  return pdfjsLoading;
}

async function extractPdfText(file) {
  const lib = await ensurePdfJs();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: arrayBuffer }).promise;
  const pages = [];
  let totalChars = 0;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let pageText = '';
    let lastY = null;
    for (const item of content.items) {
      if (typeof item.str !== 'string') continue;
      // Aggiunge uno spazio quando cambia riga (approssimativo)
      const y = item.transform ? item.transform[5] : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) {
        pageText += '\n';
      } else if (pageText && !pageText.endsWith(' ')) {
        pageText += ' ';
      }
      pageText += item.str;
      lastY = y;
    }
    pageText = pageText.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    if (pageText) {
      pages.push(pageText);
      totalChars += pageText.length;
    }
  }
  const text = pages.join('\n\n');
  return { text, numPages: pdf.numPages, totalChars: text.length };
}

// ============================================================
// APERTURA / CHIUSURA EDITOR
// ============================================================
function openEditor(name = 'Nuovo testo') {
  loadedName.textContent = '📄 ' + name;
  loaderSection.hidden = true;
  editorSection.hidden = false;
  updateCharCount();
}

skipLink.addEventListener('click', (e) => {
  e.preventDefault();
  textArea.value = '';
  openEditor('Testo da zero');
});

reloadLoaderBtn.addEventListener('click', () => {
  editorSection.hidden = true;
  loaderSection.hidden = false;
});

// ============================================================
// HANDLER FILE
// ============================================================
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const isPdf = /\.pdf$/i.test(file.name);
  const isJs = /\.m?js$/i.test(file.name);

  try {
    if (isPdf) {
      // ---- PDF ----
      let result;
      try {
        flash('📄 Estrazione testo dal PDF…');
        result = await extractPdfText(file);
      } catch (err) {
        alert('Errore nell\'estrazione del PDF:\n' + err.message);
        fileInput.value = '';
        return;
      }

      if (!result.text || result.text.length < 10) {
        alert(
          '⚠ Questo PDF non contiene testo estraibile.\n\n' +
          'Probabilmente è un PDF scansionato (immagini) o protetto.\n' +
          'Servirebbe un OCR, non supportato da questo editor.\n\n' +
          'Prova con un PDF di testo normale, oppure incolla il testo manualmente.'
        );
        fileInput.value = '';
        return;
      }

      // Applica eventuale troncatura
      let finalText = result.text;
      let truncated = false;
      if (truncatePdf.checked) {
        const limit = parseInt(truncateLimit.value, 10) || 200000;
        if (finalText.length > limit) {
          finalText = finalText.slice(0, limit);
          truncated = true;
        }
      }

      textArea.value = finalText;
      openEditor(file.name + ' (' + result.numPages + ' pagine)');
      if (truncated) {
        flash('📄 PDF troncato: ' + limit.toLocaleString('it-IT') + '/' + result.totalChars.toLocaleString('it-IT') + ' caratteri');
      } else {
        flash('📄 PDF estratto: ' + result.totalChars.toLocaleString('it-IT') + ' caratteri');
      }
    } else if (isJs) {
      // ---- JS / MJS ----
      let content = await file.text();
      try {
        const fake = {};
        new Function('window', content)(fake);
        const src = fake.AUDIO_SOURGE;
        if (Array.isArray(src)) content = src.join('\n\n');
        else if (typeof src === 'string') content = src;
      } catch (e) { /* se non è eseguibile lascio il testo com'è */ }
      textArea.value = content;
      openEditor(file.name);
    } else {
      // ---- TXT / altro testo ----
      const content = await file.text();
      textArea.value = content;
      openEditor(file.name);
    }
  } catch (err) {
    alert('Errore di lettura del file: ' + err.message);
  }
  fileInput.value = '';
});

// ============================================================
// AZIONI
// ============================================================
clearBtn.addEventListener('click', () => {
  if (confirm('Vuoi davvero cancellare tutto il testo?')) {
    textArea.value = '';
    updateCharCount();
  }
});

generateBtn.addEventListener('click', async () => {
  const rawText = textArea.value;
  const safeText = rawText.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');

  const fileContent = `// ============================================================
// audio_sourge.js — testo che l'avatar legge quando premi L
//
// - Tienilo nella STESSA cartella di avatar.html (anche su GitHub Pages).
// - Il nome deve essere esattamente: audio_sourge.js (tutto minuscolo).
// - Scrivi il testo tra i backtick. Una riga vuota = nuovo paragrafo (pausa più lunga).
// - Backtick e \${ vengono protetti automaticamente dall'editor.
// - Il file viene riletto a ogni pressione di L: salvi, premi L e senti la versione nuova.
// ============================================================
window.AUDIO_SOURGE = \`${safeText}\`;
`;

  const filename = 'audio_sourge.js';

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'JavaScript file', accept: { 'text/javascript': ['.js'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(fileContent);
      await writable.close();
      flash('✅ SALVATO CORRETTAMENTE COME audio_sourge.js');
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.warn('showSaveFilePicker saltato, utilizzo il download standard', err);
    }
  }

  const blob = new Blob([fileContent], { type: 'text/javascript;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  flash('✅ FILE SCARICATO: audio_sourge.js');
});

function flash(msg) {
  const el = document.createElement('div');
  el.className = 'flash';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 350); }, 2500);
}
</script>
</body>
</html>
</textarea>

<script>
// ============================================================
// AVATAR OPZIONI — orchestrazione
// ============================================================
const SHARED_TABS = ['schedule', 'audio'];

const loaded = new Set();
let avatarText = '';
let avatarName = '';
let avatarVer = 0;
const tabVer = {};

// --- Scheda corrente: legge il contenuto dal <textarea> invece che da base64 ---
function getSrc(name) {
  const el = document.getElementById('src-' + name);
  if (!el) return '';
  // riconverto i placeholder usati dentro le schede per non chiudere il <textarea> esterno
  return el.value.replace(/<\\\/textarea>/g, '</textarea>');
}

function load(name) {
  if (loaded.has(name)) return Promise.resolve();
  return new Promise(resolve => {
    const f = document.getElementById('f-' + name);
    f.onload = () => { loaded.add(name); resolve(); };
    f.srcdoc = getSrc(name);
  });
}

// --- Banner warning per blocchi mancanti ---
function reportMissingBlocks(html) {
  const missing = [];
  if (html.indexOf('const AUDIO_CONFIG = {') === -1) missing.push('AUDIO_CONFIG');
  if (html.indexOf('const SPEECH_VOLUME_CONFIG = {') === -1) missing.push('SPEECH_VOLUME_CONFIG');
  if (html.indexOf('const MIC_CONFIG = {') === -1) missing.push('MIC_CONFIG');
  if (html.indexOf('SCHEDULED_EVENTS') === -1) missing.push('SCHEDULED_EVENTS');
  const bar = document.getElementById('warnBar');
  if (!missing.length) {
    bar.classList.remove('show');
    bar.textContent = '';
  } else {
    bar.classList.add('show');
    bar.innerHTML = '⚠ il file non contiene: <b>' + missing.join('</b>, <b>') + '</b> — alcune schede potrebbero essere vuote.';
  }
}

// --- Ricarica le schede condivise quando avatarVer cambia ---
async function syncTab(name) {
  if (tabVer[name] === avatarVer) return;
  if (!avatarText) return;
  await load(name);
  const w = document.getElementById('f-' + name).contentWindow;
  if (w && typeof w.loadSharedAvatar === 'function') {
    await w.loadSharedAvatar(avatarName, avatarText);
    tabVer[name] = avatarVer;
  }
}

async function activate(name) {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(x => x.classList.toggle('active', x.id === 'p-' + name));

  const landing = document.getElementById('landing');
  const sharedBar = document.getElementById('sharedBar');
  const isSource = name === 'source';
  landing.hidden = isSource || !!avatarText;
  sharedBar.style.display = (isSource || !avatarText) ? 'none' : 'flex';

  await load(name);

  if (!isSource && avatarText && tabVer[name] !== avatarVer) {
    await syncTab(name);
  }
}

document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => activate(b.dataset.tab);
});

// --- Caricamento avatar condiviso ---
async function handleAvatarFile(file) {
  if (!file) return;
  avatarName = file.name;
  avatarText = await file.text();
  avatarVer++;

  // carica le due schede condivise in parallelo e passa il testo a ciascuna
  await Promise.all(SHARED_TABS.map(async n => {
    await load(n);
    const w = document.getElementById('f-' + n).contentWindow;
    if (w && typeof w.loadSharedAvatar === 'function') {
      await w.loadSharedAvatar(avatarName, avatarText);
      tabVer[n] = avatarVer;
    }
  }));

  document.getElementById('status').textContent = '📄 ' + avatarName + ' caricato in entrambe le schede';
  document.getElementById('saveAll').disabled = false;
  document.getElementById('landing').hidden = true;
  document.getElementById('sharedBar').classList.remove('before-load');
  document.getElementById('sharedBar').style.display = 'flex';

  reportMissingBlocks(avatarText);
}

document.getElementById('avatarFile').onchange = async e => {
  await handleAvatarFile(e.target.files[0]);
  e.target.value = '';
};
document.getElementById('landingFile').onchange = async e => {
  await handleAvatarFile(e.target.files[0]);
  e.target.value = '';
};

// --- Ricarica avatar corrente (senza riaprire il file dal disco) ---
document.getElementById('reloadCurrent').onclick = async () => {
  if (!avatarText) return;
  avatarVer++;
  await Promise.all(SHARED_TABS.map(async n => {
    const w = document.getElementById('f-' + n).contentWindow;
    if (w && typeof w.loadSharedAvatar === 'function') {
      await w.loadSharedAvatar(avatarName, avatarText);
      tabVer[n] = avatarVer;
    }
  }));
  document.getElementById('status').textContent = '📄 ' + avatarName + ' ricaricato';
};

// --- Salva tutto: concatena le patch Audio -> Schedule, poi scarica ---
document.getElementById('saveAll').onclick = async () => {
  try {
    await load('audio');
    await load('schedule');
    const aw = document.getElementById('f-audio').contentWindow;
    const sw = document.getElementById('f-schedule').contentWindow;

    if (typeof aw.buildNewHtml !== 'function' || typeof sw.buildNewHtml !== 'function') {
      alert('Una delle schede non è pronta: ricarica l\'avatar e riprova.');
      return;
    }

    // Ordine: prima i volumi/reattività (audio), poi eventi e frasi (schedule).
    // Ogni patch legge il testo che riceve e riscrive solo i blocchi che le competono.
    let out = aw.buildNewHtml(avatarText);
    out = sw.buildNewHtml(out);

    const name = avatarName || 'index.html';

    if (window.showSaveFilePicker) {
      try {
        const h = await window.showSaveFilePicker({
          suggestedName: name,
          types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }]
        });
        const wr = await h.createWritable();
        await wr.write(out);
        await wr.close();
        refreshSharedState(out);
        return;
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }

    const blob = new Blob([out], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    refreshSharedState(out);
  } catch (e) {
    alert('Errore: ' + e.message);
  }
};

// Dopo un salvataggio riuscito, allinea lo stato condiviso al file appena generato:
// così se passi a un'altra scheda vede la versione nuova, non quella caricata all'inizio.
function refreshSharedState(newHtml) {
  avatarText = newHtml;
  avatarVer++;
  document.getElementById('status').textContent = '💾 salvato: stato aggiornato';
  reportMissingBlocks(newHtml);
}

// --- Avvio ---
activate('schedule');
</script>
</body>
</html>
