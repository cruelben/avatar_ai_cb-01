<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Desk Avatar — Tamagotchi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #000d06; color: #00ff88;
    font-family: 'Courier New', Courier, monospace;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(0,255,136,0.06) 0%, transparent 60%),
      linear-gradient(rgba(0,255,136,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.04) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
    cursor: pointer;
    transition: background-color 1.5s ease;
    position: relative;
  }
  body.sleeping { background-color: #000a04; }
  body.ai-mode { background-color: #001a10; }
  body.ai-mode .crt-overlay { opacity: 0.7; }

  #app { position: fixed; inset: 0; transition: filter 1.2s ease; }
  body.sleeping #app { filter: brightness(0.68); }

  .crt-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background:
      linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.22) 50%),
      linear-gradient(90deg, rgba(255,0,0,0.05), rgba(0,255,0,0.02), rgba(0,0,255,0.05));
    background-size: 100% 4px, 6px 100%;
    pointer-events: none; z-index: 9999;
    animation: flicker 0.15s infinite;
    transition: opacity 1.2s ease;
  }
  body.sleeping .crt-overlay { opacity: 0.35; }
  @keyframes flicker { 0%{opacity:.95} 50%{opacity:.85} 100%{opacity:.95} }

  .avatar-container {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    border: none; border-radius: 0; overflow: hidden;
    background: radial-gradient(circle at 50% 46%, rgba(0,255,157,0.10), rgba(0,0,0,0.14) 60%), rgba(0,0,0,0.20);
    box-shadow: inset 0 0 80px rgba(0,255,157,0.05);
    transition: box-shadow 0.8s ease;
    pointer-events: none;
  }
  .avatar-container.speaking { box-shadow: inset 0 0 120px rgba(0,255,157,0.16); }
  .avatar-container.sleeping { box-shadow: inset 0 0 60px rgba(0,255,157,0.02); }
  .avatar-container.greeting { box-shadow: inset 0 0 140px rgba(0,255,157,0.22); }

  canvas { display: block; width: 100%; height: 100%; border-radius: 0; cursor: pointer; touch-action: manipulation; }

  .status {
    position: fixed; bottom: 4vh; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: clamp(10px, 1.4vw, 13px);
    color: #00cc66; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 10px #00ff88;
    text-align: center; pointer-events: none; transition: color 0.5s ease, opacity 0.8s ease;
    max-width: 90vw; padding: 0 12px; opacity: 0.35;
  }
  .status.sleeping { opacity: 0.22; color: #008855; }
  .status.talking { opacity: 0.75; color: #00ff88; }
  .status.greeting { opacity: 0.9; color: #00ffaa; }
  .status.muted { opacity: 0.9; color: #ffaa44; }
  .status.ready { opacity: 0.5; color: #00ff88; }
  .status.unlock { opacity: 0.95; color: #00ff88; }

  .subtitle {
    position: fixed; left: 50%; bottom: 11vh; transform: translateX(-50%);
    z-index: 11; max-width: 86vw; padding: 10px 22px;
    font-size: clamp(16px, 3.2vw, 30px); letter-spacing: 1px; line-height: 1.35; text-align: center;
    color: #eafff5; background: rgba(0,15,9,0.72);
    border: 1px solid rgba(0,255,157,0.35); border-radius: 12px;
    text-shadow: 0 0 12px rgba(0,255,136,0.8);
    box-shadow: 0 0 24px rgba(0,255,157,0.18);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .subtitle.show { opacity: 1; }

  #hotkey-menu {
    position: fixed; top: 20px; left: 20px; z-index: 30;
    background: rgba(0,15,9,0.94);
    border: 1px solid rgba(0,255,157,0.5);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    letter-spacing: 1px;
    line-height: 1.7;
    box-shadow: 0 0 30px rgba(0,255,157,0.25);
    max-width: 320px;
    display: none;
  }
  #hotkey-menu.show { display: block; }
  #hotkey-menu h3 {
    font-size: 11px;
    letter-spacing: 3px;
    color: #00ffaa;
    margin: 0 0 6px 0;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(0,255,157,0.25);
    padding-bottom: 4px;
  }
  #hotkey-menu h3:not(:first-child) { margin-top: 12px; }
  #hotkey-menu .row { display: flex; justify-content: space-between; gap: 16px; }
  #hotkey-menu .key {
    display: inline-block;
    min-width: 60px;
    padding: 1px 6px;
    border: 1px solid rgba(0,255,157,0.4);
    border-radius: 4px;
    text-align: center;
    font-weight: bold;
    color: #00ff88;
    background: rgba(0,255,136,0.06);
  }
  #hotkey-menu .label { color: rgba(0,255,157,0.65); }
  #hotkey-menu .row.active .key {
    background: rgba(0,255,136,0.35);
    border-color: #00ff88;
    color: #ffffff;
    box-shadow: 0 0 8px rgba(0,255,136,0.6);
  }
  #hotkey-menu .row.active .label { color: #00ffaa; }
  #hotkey-menu .footer {
    margin-top: 12px;
    font-size: 10px;
    opacity: 0.55;
    text-align: center;
    letter-spacing: 1.5px;
  }

  /* --- INTERFACCIA MOBILE (TOUCH) --- */
  #mobile-controls {
    display: none; /* Nascosto di default (PC) */
    position: fixed; inset: 0; pointer-events: none; z-index: 40;
  }
  
  /* Mostra solo su dispositivi touch / schermi piccoli */
  @media (pointer: coarse), (max-width: 800px) {
    #mobile-controls { display: block; }
  }

  .mobile-btn {
    pointer-events: auto;
    position: absolute;
    background: rgba(0,20,10,0.6);
    border: 1px solid rgba(0,255,136,0.4);
    color: #00ff88;
    font-family: inherit;
    font-weight: bold;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 15px rgba(0,255,136,0.1);
    transition: all 0.1s;
  }
  .mobile-btn:active {
    background: rgba(0,255,136,0.3);
    transform: scale(0.95);
  }
  .mobile-btn.active {
    background: rgba(0,255,136,0.3);
    border-color: #00ff88;
    color: #ffffff;
    box-shadow: 0 0 20px rgba(0,255,136,0.5);
  }

  /* Pulsanti principali in basso */
  .bottom-bar {
    position: absolute;
    bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px;
  }
  .bottom-bar .mobile-btn {
    width: 56px; height: 56px;
    font-size: 20px;
    position: relative;
  }

  /* Ingranaggio in alto a sinistra */
  #gear-btn {
    top: 20px; left: 20px;
    width: 40px; height: 40px;
    font-size: 18px;
    border-radius: 50%;
  }

  /* Menu secondario (S, N, D) */
  #gear-menu {
    pointer-events: auto;
    position: absolute; top: 70px; left: 20px;
    background: rgba(0,20,10,0.9);
    border: 1px solid rgba(0,255,136,0.4);
    border-radius: 10px;
    padding: 10px;
    display: none;
    flex-direction: column; gap: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  #gear-menu.show { display: flex; }
  #gear-menu .mobile-btn {
    position: relative;
    width: 44px; height: 44px;
    font-size: 16px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="avatar-container" id="avatarContainer">
    <canvas id="avatarCanvas" aria-label="Interactive neon avatar"></canvas>
  </div>
</div>
<div class="crt-overlay"></div>

<!-- Pulsanti Mobile -->
<div id="mobile-controls">
  <button id="gear-btn" class="mobile-btn">⚙️</button>
  <div id="gear-menu">
    <button id="btn-mobile-s" class="mobile-btn">S</button>
    <button id="btn-mobile-n" class="mobile-btn">N</button>
    <button id="btn-mobile-d" class="mobile-btn">D</button>
  </div>
  <div class="bottom-bar">
    <button id="btn-mobile-a" class="mobile-btn">A</button>
    <button id="btn-mobile-t" class="mobile-btn">T</button>
    <button id="btn-mobile-l" class="mobile-btn">L</button>
    <button id="btn-mobile-m" class="mobile-btn">M</button>
  </div>
</div>

<div class="status unlock" id="status">▶ tap once to enable sound</div>
<div class="subtitle" id="subtitle"></div>

<div id="hotkey-menu">
  <h3>AI MODE</h3>
  <div class="row" id="hk-ai-ctx"><span class="key">A</span><span class="label">AI con contesto</span></div>
  <div class="row" id="hk-ai"><span class="key">T</span><span class="label">AI senza contesto</span></div>
  <div class="row" id="hk-input"><span class="key">←</span><span class="label">apri/chiudi campo</span></div>
  <div class="row" id="hk-esc"><span class="key">Esc</span><span class="label">chiudi / menu</span></div>

  <h3>AVATAR</h3>
  <div class="row"><span class="key">Tap</span><span class="label">saluta / sblocca audio</span></div>
  <div class="row" id="hk-read"><span class="key">L</span><span class="label">leggi audio_sourge.js</span></div>
  <div class="row" id="hk-subs"><span class="key">S</span><span class="label">sottotitoli</span></div>
  <div class="row" id="hk-mute"><span class="key">M</span><span class="label">muto audio / stop voce</span></div>

  <h3>MICROFONO</h3>
  <div class="row" id="hk-mic"><span class="key">N</span><span class="label">mic reattivo on/off</span></div>
  <div class="row" id="hk-mic-debug"><span class="key">D</span><span class="label">debug mic</span></div>

  <div class="footer">Esc per chiudere</div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const ZOOM = 1.4;
const PROXY_BASE_URL = 'https://cb01-proxy.cruelben.workers.dev';
const GEMINI_MODEL = 'gemini-3.5-flash-lite';
const GEMINI_SYSTEM_PROMPT = "Sei CB-01, un avatar da scrivania sarcastico. Rispondi breve, massimo 2-3 frasi. Non essere gentile, sii diretto.";

const MOOD_CONFIG = {
  microsleepMinMs: 3 * 60 * 1000, microsleepMaxMs: 12 * 60 * 1000,
  microsleepDurationMinMs: 3000, microsleepDurationMaxMs: 10000,
  yawnMinMs: 90 * 1000, yawnMaxMs: 6 * 60 * 1000,
  expressionMinMs: 20 * 1000, expressionMaxMs: 70 * 1000,
  selfTalkMinMs: 45 * 60 * 1000, selfTalkMaxMs: 2 * 60 * 60 * 1000,
  greetDurationMs: 5000
};

const AUDIO_CONFIG = {
  chirpVolume: 0.026, greetVolume: 0.025, yawnVolume: 0.114,
  selfTalkVolume: 0.4, lowVolume: 0.4, scheduledVolume: 0.85,
  readVolume: 0.5, enabled: true
};

const SELF_TALK_PHRASES = ["che ore sono?","ho fame","che palle","mi annoio","ancora qui?","quasi ora di staccare","un caffè, dai","basta guardarmi","quanto manca?","che sonno"];
const AWAKE_EXPRESSIONS = ['neutro','neutro','neutro','felice','annoiato','assonnato','sorpreso'];

const SCHEDULED_EVENTS = [
  { h: 11, m: 0, sequence: [" è l'ora del caffe, ", "non fare lo stacanovista ", "", "del cazzo"] },
  { h: 12, m: 30, sequence: ["tra poco si esce,", "", "hai sentito Bessi?"] },
  { h: 15, m: 0, text: "che pomeriggio di m." },
  { h: 16, m: 0, text: " è quasi finita" },
  { h: 16, m: 45, sequence: ["E' ora di fare un","Lento","SHAT DAAUNN!!!","E' stato bello lavorare con voi","chiudo","E","Mi levo dai coglioni","Ciao Piera","Ciao Marino","quando uscite spegnete tutto","","cazzo!"] },
  { h: 17, m: 1, sequence: ["che fai ancora qui?","","non hai una vita?"] },
  { h: 17, m: 15, sequence: ["guarda che il treno non ti aspetta","","non fare il coglione"] },
];

const COLOR_MAIN = '#00ff88';
const COLOR_GLOW = 'rgba(0,255,136,0.8)';

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const container = document.getElementById('avatarContainer');
const hotkeyMenuEl = document.getElementById('hotkey-menu');
const gearMenuEl = document.getElementById('gear-menu');

const btnMobileA = document.getElementById('btn-mobile-a');
const btnMobileT = document.getElementById('btn-mobile-t');
const btnMobileL = document.getElementById('btn-mobile-l');
const btnMobileM = document.getElementById('btn-mobile-m');
const btnMobileS = document.getElementById('btn-mobile-s');
const btnMobileN = document.getElementById('btn-mobile-n');
const btnMobileD = document.getElementById('btn-mobile-d');

// ============================================================
// HELPERS
// ============================================================
function rand(min, max) { return min + Math.random() * (max - min); }
function lerp(a, b, t) { return a + (b - a) * t; }
function isTypingInField() {
  const el = document.activeElement;
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
}

// ============================================================
// RESPONSIVE
// ============================================================
let LW = 420, LH = 420;
function fitAvatar() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const S = (Math.min(w, h) / 420) * ZOOM;
  LW = w / S; LH = h / S;
  ctx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
}
window.addEventListener('resize', fitAvatar);
window.addEventListener('orientationchange', () => setTimeout(fitAvatar, 100));
fitAvatar();

// ============================================================
// STATE
// ============================================================
let currentMood = 'awake';
let moodStartTime = Date.now();
let moodDurationMs = 0;
let nextMicrosleepAt = Date.now() + rand(MOOD_CONFIG.microsleepMinMs, MOOD_CONFIG.microsleepMaxMs);
let nextYawnAt = Date.now() + rand(MOOD_CONFIG.yawnMinMs, MOOD_CONFIG.yawnMaxMs);
let nextExpressionAt = Date.now() + rand(MOOD_CONFIG.expressionMinMs, MOOD_CONFIG.expressionMaxMs);
let nextSelfTalkAt = Date.now() + rand(MOOD_CONFIG.selfTalkMinMs, MOOD_CONFIG.selfTalkMaxMs);

let audioUnlocked = false;
let muted = false;
let aiMode = false;
let aiWithContext = false;
let aiTextInputOpen = false;
let aiProcessing = false;
let hotkeyMenuOpen = false;

let isSpeaking = false;
let mouthOpen = 0;
let targetMouthOpen = 0;
let time = 0;
let clickTargetX = 0;
let clickTargetY = 0;
let sleepZs = [];
let zSpawnTimer = 0;

let eyeBlink = 0;
let blinkPhase = 'idle';
let blinkPhaseTimer = 0;
let blinkCloseDuration = 4;
let blinkOpenDuration = 4;
let blinkPauseMin = 150;
let blinkNextDelay = 0;
let blinkWantsDouble = false;
let blinkDoubleGapDuration = 8;
let forcedBlinkQueue = 0;

let yawnActive = 0;
let yawnPhase = 0;
let mouthTwitchTimer = 0;
let mouthTwitchNextAt = rand(20, 60) * 60;
let mouthTwitchActive = 0;
let mouthTwitchPhase = 0;
let mouthTwitchDir = 1;
let browTwitchTimer = 0;
let browTwitchNextAt = rand(15, 45) * 60;
let browTwitchActive = 0;
let browTwitchPhase = 0;
let browTwitchAmount = 0;
let headDriftTimer = 0;
let headDriftNextAt = 90 + Math.random() * 150;
let headDriftTarget = 0;
let headDriftCurrent = 0;
let pupilScale = 1;
let pupilScaleTarget = 1;
let pupilTimer = 0;
let pupilNextAt = 180 + Math.random() * 240;
let wanderActive = false;
let wanderTimer = 0;
let wanderNextAt = 120 + Math.random() * 180;
let wanderTargetX = 0, wanderTargetY = 0, wanderReturnTimer = 0;
let saccadeTimer = 0;
let saccadeNextAt = 15 + Math.random() * 25;
let saccadeX = 0, saccadeY = 0;
let saccadeTargetX = 0, saccadeTargetY = 0;
let reflectionTimer = 0;
let reflectionNextAt = 1500 + Math.random() * 1500;
let reflectionActive = 0;
let reflectionPhase = 0;
let reflectionTotalFrames = 180;
let breathPhaseA = 0, breathPhaseB = 0, breathPhaseC = 0;
let breathCycleTimer = 0;
let breathCycleDuration = 180 + Math.random() * 120;
let currentBreathOffset = 0;
let glitchTimer = 0;
let glitchNextAt = 600 + Math.random() * 1200;
let glitchIntensity = 0;
let eyeTargetX = 0, eyeTargetY = 0;
let eyeCurrentX = 0, eyeCurrentY = 0;
let mouseMovedTimer = 0;
let mouseIsActive = false;

let currentEmotion = { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
let targetEmotion = { ...currentEmotion };

// ============================================================
// AUDIO
// ============================================================
let audioCtx = null;
function initAudioContext() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(freq, duration, volume, type, freqEnd) {
  if (!audioCtx || !AUDIO_CONFIG.enabled || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, t + duration);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(volume, t + 0.03);
  gain.gain.linearRampToValueAtTime(0, t + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + duration + 0.05);
}
function playChirp() {
  tone(720, 0.09, AUDIO_CONFIG.chirpVolume, 'sine', 620);
  setTimeout(() => tone(560, 0.12, AUDIO_CONFIG.chirpVolume, 'sine', 480), 95);
}
function playGreet() {
  tone(440, 0.07, AUDIO_CONFIG.greetVolume, 'sine');
  setTimeout(() => tone(660, 0.07, AUDIO_CONFIG.greetVolume, 'sine'), 80);
  setTimeout(() => tone(880, 0.13, AUDIO_CONFIG.greetVolume, 'sine', 820), 160);
}
function playYawn() {
  if (!audioCtx || !AUDIO_CONFIG.enabled || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.linearRampToValueAtTime(300, t + 0.45);
  osc.frequency.linearRampToValueAtTime(160, t + 1.0);
  filter.type = 'lowpass'; filter.frequency.value = 480;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(AUDIO_CONFIG.yawnVolume, t + 0.25);
  gain.gain.linearRampToValueAtTime(0, t + 1.0);
  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 1.05);
}

// ============================================================
// PARTICLES
// ============================================================
let particles = [];
class Particle {
  constructor() { this.reset(); this.y = Math.random() * LH; }
  reset() {
    this.x = Math.random() * LW; this.y = LH + 20;
    this.sizeBase = Math.random() * 2.5 + 0.5; this.size = this.sizeBase;
    this.speedBase = Math.random() * 0.4 + 0.2; this.speed = this.speedBase;
    this.alphaBase = Math.random() * 0.4 + 0.15; this.alpha = this.alphaBase;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.02 + 0.008;
  }
  update(intensity) {
    this.speed = this.speedBase * (1 + intensity * 2.5);
    this.size = this.sizeBase * (1 + intensity * 1.5);
    this.alpha = Math.min(1, this.alphaBase * (1 + intensity * 2));
    this.wobble += this.wobbleSpeed * (1 + intensity * 2);
    this.y -= this.speed;
    this.x += Math.sin(this.wobble) * (0.4 + intensity * 1.5);
    if (this.y < -20) this.reset();
  }
  draw() {
    ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = COLOR_MAIN;
    ctx.shadowBlur = 6 + 10 * (this.size / this.sizeBase - 1); ctx.shadowColor = COLOR_MAIN;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}
for (let i = 0; i < 90; i++) particles.push(new Particle());

// ============================================================
// WAVES
// ============================================================
let waves = [];
let waveSpawnTimer = 0;
function spawnWave(baseAlpha, baseSpeed) {
  waves.push({ radius: 180, maxRadius: 260 + Math.random() * 60, alpha: baseAlpha, speed: baseSpeed + Math.random() * 0.6, width: 1.5 + Math.random() * 1 });
}
function updateWaves() {
  waveSpawnTimer++;
  const spawnInterval = isSpeaking ? 10 : (currentMood === 'sleeping' ? 130 : 55);
  const baseAlpha = isSpeaking ? 0.65 : (currentMood === 'sleeping' ? 0.12 : 0.30);
  const baseSpeed = isSpeaking ? 1.2 : (currentMood === 'sleeping' ? 0.35 : 0.65);
  if (waveSpawnTimer >= spawnInterval) { waveSpawnTimer = 0; spawnWave(baseAlpha, baseSpeed); }
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i]; w.radius += w.speed; w.alpha -= 0.010;
    if (w.alpha <= 0 || w.radius >= w.maxRadius) waves.splice(i, 1);
  }
}
function drawWaves(cx, cy) {
  waves.forEach(w => {
    ctx.save(); ctx.strokeStyle = COLOR_MAIN; ctx.globalAlpha = w.alpha; ctx.lineWidth = w.width;
    ctx.shadowBlur = 15; ctx.shadowColor = COLOR_GLOW;
    ctx.beginPath(); ctx.arc(cx, cy, w.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  });
}

// ============================================================
// SYLLABLES / WORDS / VOICES
// ============================================================
function getSyllables(text) {
  const words = text.toLowerCase().match(/[a-zàèéìòù]+/g) || [];
  const result = []; const vowels = 'aeiouàèéìòù';
  for (const word of words) {
    let cur = '';
    for (let i = 0; i < word.length; i++) {
      cur += word[i];
      const isV = vowels.includes(word[i]);
      const nextV = i + 1 < word.length && vowels.includes(word[i + 1]);
      if (isV && !nextV) { result.push(cur); cur = ''; }
    }
    if (cur) result.push(cur);
  }
  return result;
}
function extractWords(text) {

function stopMic() { micState = 'spento'; if (micStream) micStream.getTracks().forEach(t => t.stop()); if (micSource) { try { micSource.disconnect(); } catch (e) {} } micStream = null; micSource = null; micAnalyser = null; micBuf = null; }
function micSpeak(text) { enterState('talking', 0); speakText(text, MIC_CONFIG.speakVolume, () => { setTimeout(() => { if (currentMood === 'talking') enterState('awake', 0); }, 400); }); setTimeout(() => { if (currentMood === 'talking') { stopSpeaking(); enterState('awake', 0); } }, 6000); }
function micReact() { const now = Date.now(); if (now - lastMicReactAt < MIC_CONFIG.cooldownMs) { micLastEvent += ' → in pausa'; return; } lastMicReactAt = now; if (currentMood === 'sleeping') wakeFromMicrosleep(); forcedBlinkQueue = Math.max(forcedBlinkQueue, 1); if (Math.random() < MIC_CONFIG.speakChance && canSpeakNow()) micSpeak(pickFrom(MIC_PHRASES)); activeEmotion = 'sorpreso'; emotionHoldFrames = 120; }
function endBurst(now, spikeThr) {
  const dur = Math.round(burstLastLoud - burstStart); const peak = burstPeak; const crest = burstMaxCrest;
  burstStart = 0; burstPeak = 0; burstMaxCrest = 0;
  const info = dur + 'ms picco ' + peak.toFixed(3) + ' crest ' + crest.toFixed(1);
  if (dur < MIC_CONFIG.spikeMaxMs && peak > spikeThr && (crest >= MIC_CONFIG.crestMin || peak > spikeThr * MIC_CONFIG.loudMult)) { micLastEvent = 'colpo ' + info; micReact(); return; }
  if (dur >= MIC_CONFIG.listenAfterMs && dur < 45000) {
    micLastEvent = 'voce ' + info; micListenUntil = now + 1500; if (currentMood === 'sleeping') wakeFromMicrosleep();
    if (dur >= MIC_CONFIG.voiceReplyMinMs) {
      const sinceReply = now - lastVoiceReplyAt; let why = '';
      if (sinceReply <= MIC_CONFIG.voiceReplyCooldownMs) why = 'pausa ancora ' + Math.ceil((MIC_CONFIG.voiceReplyCooldownMs - sinceReply) / 1000) + 's';
      else if (Math.random() >= MIC_CONFIG.voiceReplyChance) why = 'non ha "tirato" a rispondere (probabilità)';
      else why = cannotSpeakReason();
      if (why) micLastEvent += ' → non risponde: ' + why;
      else { lastVoiceReplyAt = now; micSpeak(pickFrom(VOICE_REPLIES)); micLastEvent += ' → risponde'; }
    }
    return;
  }
  micLastEvent = 'ignorato: ' + info;
}
function micTick() {
  if (!micAnalyser) return; if (aiMode) return; if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  micAnalyser.getFloatTimeDomainData(micBuf);
  let sum = 0, peak = 0;
  for (let i = 0; i < micBuf.length; i++) { const v = micBuf[i]; sum += v * v; const a = v < 0 ? -v : v; if (a > peak) peak = a; }
  const rmsRaw = Math.sqrt(sum / micBuf.length); micCrest = rmsRaw > 0.0005 ? peak / rmsRaw : 0;
  const rms = Math.max(rmsRaw, peak * 0.4); micLevel = rms;
  const now = Date.now(); const dt = Math.min(200, now - micLastTickAt); micLastTickAt = now;
  if (now - micStartedAt < MIC_CONFIG.calibrationMs) { micFloor = micFloor === 0 ? rms : lerp(micFloor, rms, Math.min(1, dt / 400)); return; }
  const reason = (isSpeaking || currentMood === 'talking') ? 'sta parlando' : currentMood === 'greeting' ? 'saluto (5 s dopo un tap)' : yawnActive > 0 ? 'sbadiglio' : (now - lastSpeechEnd < 1000) ? 'eco della sua voce' : '';
  if (reason) { micIgnore = reason; burstStart = 0; burstPeak = 0; micListening = false; return; }
  micIgnore = '';
  const voiceThr = Math.max(micFloor * MIC_CONFIG.voiceRatio, MIC_CONFIG.voiceMin); const spikeThr = Math.max(micFloor * MIC_CONFIG.spikeRatio, MIC_CONFIG.minLevel);
  if (rms < micFloor) micFloor += (rms - micFloor) * Math.min(1, dt / 1200); else if (!burstStart || now - burstStart > 20000) micFloor += (rms - micFloor) * Math.min(1, dt / 20000);
  if (rms > voiceThr) { if (!burstStart) { burstStart = now; burstPeak = 0; burstMaxCrest = 0; } burstLastLoud = now; if (rms > burstPeak) burstPeak = rms; if (micCrest > burstMaxCrest) burstMaxCrest = micCrest; lastSoundAt = now; silenceBoosted = false; }
  else if (burstStart && now - burstLastLoud > MIC_CONFIG.burstGapMs) { endBurst(now, spikeThr); }
  micListening = (burstStart > 0 && now - burstStart >= MIC_CONFIG.listenAfterMs && now - burstStart < 45000) || now < micListenUntil;
  if (!silenceBoosted && now - lastSoundAt > MIC_CONFIG.silenceBoostAfterMs) { silenceBoosted = true; nextYawnAt = Math.min(nextYawnAt, now + rand(20000, 60000)); nextMicrosleepAt = Math.min(nextMicrosleepAt, now + rand(60000, 180000)); }
}
setInterval(micTick, 15);

function drawMicDebug() {
  if (!micDebug) return;
  const x = 39, y = LH - 130; const voiceThr = Math.max(micFloor * MIC_CONFIG.voiceRatio, MIC_CONFIG.voiceMin); const spikeThr = Math.max(micFloor * MIC_CONFIG.spikeRatio, MIC_CONFIG.minLevel);
  ctx.save(); ctx.shadowBlur = 0; ctx.font = '10px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(0,255,157,0.9)';
  ctx.fillText('MIC: ' + micState + ' | ctx: ' + (audioCtx ? audioCtx.state : 'n/d') + (micListening ? ' | ASCOLTO' : '') + (aiMode ? ' | AI' : ''), x, y);
  ctx.fillText('lvl ' + micLevel.toFixed(3) + '  fondo ' + micFloor.toFixed(3) + '  crest ' + micCrest.toFixed(1), x, y + 14);
  ctx.fillText('voce ' + voiceThr.toFixed(3) + '  colpo ' + spikeThr.toFixed(3), x, y + 26);
  ctx.fillText('evento: ' + micLastEvent, x, y + 38);
  if (micIgnore) { ctx.fillStyle = '#ffaa44'; ctx.fillText('ignoro: ' + micIgnore, x, y + 50); ctx.fillStyle = 'rgba(0,255,157,0.9)'; }
  const W = 180, H = 6, scale = W / Math.max(spikeThr * 2, 0.05);
  ctx.strokeStyle = 'rgba(0,255,157,0.6)'; ctx.lineWidth = 1;
  ctx.strokeRect(x, y + 58, W, H); ctx.fillRect(x, y + 58, Math.min(W, micLevel * scale), H);
  ctx.fillStyle = '#ffcc44'; ctx.fillRect(x + Math.min(W, voiceThr * scale), y + 55, 2, H + 6);
  ctx.fillStyle = '#ff6644'; ctx.fillRect(x + Math.min(W, spikeThr * scale), y + 55, 2, H + 6);
  ctx.restore();
}

// ============================================================
// MODALITÀ AI (Gemini Flash) — A con contesto / T senza contesto
// ============================================================
let aiContext = ''; let aiContextLoaded = false; let aiHistory = [];

async function loadAiContext() {
  if (aiContextLoaded) return;
  try {
    const src = await loadReadFile(); if (typeof src === 'string') aiContext = src; else if (Array.isArray(src)) aiContext = src.map(String).join('\n\n'); else aiContext = '';
    aiContextLoaded = true;
  } catch (e) { aiContext = ''; aiContextLoaded = true; console.warn('audio_sourge.js non caricato, AI mode senza contesto'); }
}

async function askGemini(userText) {
  if (aiProcessing) return;
  if (!PROXY_BASE_URL || PROXY_BASE_URL.includes('IL_TUO_INDIRIZZO')) { notice("🔑 Configura l'URL del proxy nel codice"); return; }

  aiProcessing = true; updateStatus('🤔 CB-01 sta pensando…', 'talking'); enterState('talking', 0); showSubtitle('…');

  aiHistory.push({ role: 'user', parts: [{ text: userText }] });

  let systemText;
  if (aiWithContext && aiContext) {
    systemText = `Sei un assistente che risponde a domande basandosi esclusivamente sul materiale fornito qui sotto.

REGOLE (hanno priorità su tutto il resto):
- Rispondi solo ed esclusivamente in base al materiale.
- Se la risposta non è nel materiale, dillo chiaramente senza inventare.
- Non aggiungere opinioni, battute, commenti personali o informazioni esterne.
- Tono neutro, chiaro e professionale. Nessun sarcasmo, nessuna battuta.
- Rispondi in italiano, in modo conciso (massimo 3-4 frasi).

--- INIZIO MATERIALE ---
${aiContext}
--- FINE MATERIALE ---`;
  } else { systemText = GEMINI_SYSTEM_PROMPT; }

  const url = `${PROXY_BASE_URL}/gemini/v1beta/models/${GEMINI_MODEL}:generateContent`;

  try {
    const response = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system_instruction: { parts: [{ text: systemText }] }, contents: aiHistory, generationConfig: { temperature: 0.7, maxOutputTokens: 300 } })
    });
    const data = await response.json();
    if (!response.ok) { const msg = (data && data.error && data.error.message) || 'errore API'; throw new Error(msg); }
    const reply = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || '…';
    aiHistory.push({ role: 'model', parts: [{ text: reply }] });
    aiProcessing = false;
    speakText(reply, 0.9, () => {
      setTimeout(() => {
        if (aiMode) {
          enterState('awake', 0);
          updateStatus(aiWithContext ? '🤖 AI+CTX — premi ← per scrivere' : '🤖 AI MODE — premi ← per scrivere', 'greeting');
        }
      }, 500);
    });
  } catch (err) {
    aiProcessing = false; aiHistory.pop(); console.error('Gemini error:', err);
    showSubtitle('⚠ ' + err.message); hideSubtitle(3000); updateStatus('⚠ errore API', 'muted');
    setTimeout(() => { if (aiMode) { enterState('awake', 0); updateStatus(aiWithContext ? '🤖 AI+CTX — premi ← per scrivere' : '🤖 AI MODE — premi ← per scrivere', 'greeting'); } }, 2000);
  }
}

async function enterAiMode(withContext) {
  if (aiMode) exitAiMode(true);
  aiMode = true; aiWithContext = !!withContext; stopSpeaking(); stopMic();
  enterState('awake', 0); document.body.classList.add('ai-mode'); aiHistory = [];

  if (aiWithContext) {
    updateStatus('📖 carico contesto…', 'muted'); await loadAiContext();
    if (aiContext) { updateStatus('🤖 AI+CTX — premi ← per scrivere', 'greeting'); notice('📖 contesto caricato'); }
    else { aiWithContext = false; updateStatus('🤖 AI MODE — premi ← per scrivere', 'greeting'); notice('📖 audio_sourge.js non trovato, modalità senza contesto'); }
  } else { updateStatus('🤖 AI MODE — premi ← per scrivere', 'greeting'); }
  openAiTextInput();
  updateMobileButtonsUI();
}

function exitAiMode(silent) {
  aiMode = false; aiWithContext = false; stopSpeaking(); aiTextInputOpen = false; closeAiTextInput(); aiHistory = [];
  document.body.classList.remove('ai-mode'); startMic(false); updateMoodUI(); if (!silent) notice('🤖 AI MODE off');
  updateMobileButtonsUI();
}

function openAiTextInput() {
  if (aiTextInputOpen) return;
  aiTextInputOpen = true;
  const wrap = document.createElement('div');
  wrap.id = 'ai-input-wrap';
  wrap.style.cssText = `position: fixed; left: 50%; bottom: 20vh; transform: translateX(-50%); z-index: 20; width: min(80vw, 700px); display: flex; gap: 8px; background: rgba(0,15,9,0.9); border: 1px solid rgba(0,255,157,0.5); border-radius: 10px; padding: 10px; box-shadow: 0 0 30px rgba(0,255,157,0.25);`;
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = aiWithContext ? 'Fai una domanda sul file… (Invio invia, Esc chiude)' : 'Scrivi a CB-01… (Invio invia, Esc chiude)';
  input.style.cssText = `flex: 1; background: rgba(0,0,0,0.5); color: #00ff88; border: 1px solid rgba(0,255,157,0.3); border-radius: 6px; padding: 10px 12px; font-family: inherit; font-size: 15px; outline: none;`;
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim()) { const t = input.value.trim(); input.value = ''; closeAiTextInput(); askGemini(t); }
    else if (e.key === 'Escape') { e.stopPropagation(); closeAiTextInput(); }
  });
  wrap.appendChild(input); document.body.appendChild(wrap); input.focus();
}

function closeAiTextInput() { aiTextInputOpen = false; const el = document.getElementById('ai-input-wrap'); if (el) el.remove(); }

// ============================================================
// MENU SCORCIATOIE (Esc)
// ============================================================
function updateHotkeyMenu() {
  const set = (id, active) => { const el = document.getElementById(id); if (el) el.classList.toggle('active', !!active); };
  set('hk-ai', aiMode && !aiWithContext); set('hk-ai-ctx', aiMode && aiWithContext); set('hk-input', aiTextInputOpen);
  set('hk-esc', hotkeyMenuOpen); set('hk-read', readActive); set('hk-subs', subtitlesOn); set('hk-mute', muted);
  set('hk-mic', micEnabled && micState === 'attivo'); set('hk-mic-debug', micDebug);
}
function openHotkeyMenu() { hotkeyMenuOpen = true; updateHotkeyMenu(); hotkeyMenuEl.classList.add('show'); }
function closeHotkeyMenu() { hotkeyMenuOpen = false; hotkeyMenuEl.classList.remove('show'); }

function updateMobileButtonsUI() {
  btnMobileA.classList.toggle('active', aiMode && aiWithContext);
  btnMobileT.classList.toggle('active', aiMode && !aiWithContext);
  btnMobileL.classList.toggle('active', readActive);
  btnMobileM.classList.toggle('active', muted);
  btnMobileS.classList.toggle('active', subtitlesOn);
  btnMobileN.classList.toggle('active', micEnabled && micState === 'attivo');
  btnMobileD.classList.toggle('active', micDebug);
}

// ============================================================
// TASTI (Desktop)
// ============================================================
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.key === 'a' || e.key === 'A') { e.preventDefault(); if (aiMode && aiWithContext) exitAiMode(); else enterAiMode(true); }
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.key === 't' || e.key === 'T') { e.preventDefault(); if (aiMode && !aiWithContext) exitAiMode(); else enterAiMode(false); }
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.key !== 'Backspace') return;
  if (!aiMode) { notice('🤖 attiva prima la modalità AI (A o T)'); return; }
  e.preventDefault(); if (aiTextInputOpen) closeAiTextInput(); else openAiTextInput();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return; if (isTypingInField()) return;
  if (hotkeyMenuOpen) { closeHotkeyMenu(); return; } openHotkeyMenu();
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return; if ((e.key !== 'l' && e.key !== 'L') || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (readActive) stopReading(); else startReading();
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return; if ((e.key !== 'm' && e.key !== 'M') || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  muted = !muted;
  if (muted) { stopSpeaking(); updateStatus('🔇 muted (voce e suoni spenti)', 'muted'); }
  else { updateStatus('🔊 audio riattivato', 'ready'); }
  try { localStorage.setItem('avatar_muted', muted ? '1' : '0'); } catch (err) {}
  setTimeout(() => { updateMoodUI(); }, 1500);
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return; if ((e.key !== 's' && e.key !== 'S') || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  subtitlesOn = !subtitlesOn; try { localStorage.setItem('avatar_subs', subtitlesOn ? '1' : '0'); } catch (err) {}
  if (subtitlesOn && currentSubtitle) showSubtitle(currentSubtitle); else if (!subtitlesOn) subtitleEl.classList.remove('show');
  updateStatus(subtitlesOn ? '💬 sottotitoli on' : '💬 sottotitoli off', 'muted'); setTimeout(() => { updateMoodUI(); }, 1500);
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return; if ((e.key !== 'd' && e.key !== 'D') || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return; micDebug = !micDebug; updateMobileButtonsUI();
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return; if ((e.key !== 'n' && e.key !== 'N') || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  micEnabled = !micEnabled; try { localStorage.setItem('avatar_mic', micEnabled ? '1' : '0'); } catch (err) {}
  if (micEnabled) { micAsked = false; startMic(true); } else { stopMic(); }
  updateStatus(micEnabled ? '🎙 mic on' : '🎙 mic off', 'muted'); setTimeout(() => { updateMoodUI(); }, 1500);
});

// ============================================================
// AZIONI PULSANTI MOBILE
// ============================================================
document.getElementById('gear-btn').addEventListener('click', (e) => {
  e.stopPropagation(); gearMenuEl.classList.toggle('show'); updateMobileButtonsUI();
});
document.body.addEventListener('click', (e) => {
  if (!e.target.closest('#gear-btn') && !e.target.closest('#gear-menu')) {
    gearMenuEl.classList.remove('show');
  }
});

btnMobileA.addEventListener('click', (e) => { e.stopPropagation(); if (aiMode && aiWithContext) exitAiMode(); else enterAiMode(true); });
btnMobileT.addEventListener('click', (e) => { e.stopPropagation(); if (aiMode && !aiWithContext) exitAiMode(); else enterAiMode(false); });
btnMobileL.addEventListener('click', (e) => { e.stopPropagation(); if (readActive) stopReading(); else startReading(); });
btnMobileM.addEventListener('click', (e) => {
  e.stopPropagation(); muted = !muted;
  if (muted) { stopSpeaking(); updateStatus('🔇 muted', 'muted'); }
  else { updateStatus('🔊 audio on', 'ready'); }
  try { localStorage.setItem('avatar_muted', muted ? '1' : '0'); } catch (err) {}
  setTimeout(() => { updateMoodUI(); }, 1500);
});
btnMobileS.addEventListener('click', (e) => {
  e.stopPropagation(); subtitlesOn = !subtitlesOn; try { localStorage.setItem('avatar_subs', subtitlesOn ? '1' : '0'); } catch (err) {}
  if (subtitlesOn && currentSubtitle) showSubtitle(currentSubtitle); else if (!subtitlesOn) subtitleEl.classList.remove('show');
  updateStatus(subtitlesOn ? '💬 sottotitoli on' : '💬 sottotitoli off', 'muted'); setTimeout(() => { updateMoodUI(); }, 1500); gearMenuEl.classList.remove('show');
});
btnMobileN.addEventListener('click', (e) => {
  e.stopPropagation(); micEnabled = !micEnabled; try { localStorage.setItem('avatar_mic', micEnabled ? '1' : '0'); } catch (err) {}
  if (micEnabled) { micAsked = false; startMic(true); } else { stopMic(); }
  updateStatus(micEnabled ? '🎙 mic on' : '🎙 mic off', 'muted'); setTimeout(() => { updateMoodUI(); }, 1500); gearMenuEl.classList.remove('show');
});
btnMobileD.addEventListener('click', (e) => {
  e.stopPropagation(); micDebug = !micDebug; gearMenuEl.classList.remove('show'); updateMobileButtonsUI();
});

// ============================================================
// STARTUP
// ============================================================
try { const m = localStorage.getItem('avatar_muted'); if (m === '1') muted = true; } catch (e) {}

enterState('awake', 0);
setInterval(checkScheduledEvents, 5000); checkScheduledEvents();

function renderLoop() { drawAvatar(); requestAnimationFrame(renderLoop); }
renderLoop();
</script>
