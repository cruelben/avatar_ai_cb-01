<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Desk Avatar — Tamagotchi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #000d06; color: #00ff88;
    font-family: 'Courier New', Courier, monospace;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(0,255,136,0.06) 0%, transparent 60%),
      linear-gradient(rgba(0,255,136,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.04) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
    cursor: pointer;
    transition: background-color 1.5s ease;
    position: relative;
  }
  body.sleeping { background-color: #000a04; }
  body.ai-mode { background-color: #001a10; }
  body.ai-mode .crt-overlay { opacity: 0.7; }

  #app { position: fixed; inset: 0; transition: filter 1.2s ease; }
  body.sleeping #app { filter: brightness(0.68); }

  .crt-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background:
      linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.22) 50%),
      linear-gradient(90deg, rgba(255,0,0,0.05), rgba(0,255,0,0.02), rgba(0,0,255,0.05));
    background-size: 100% 4px, 6px 100%;
    pointer-events: none; z-index: 9999;
    animation: flicker 0.15s infinite;
    transition: opacity 1.2s ease;
  }
  body.sleeping .crt-overlay { opacity: 0.35; }
  @keyframes flicker { 0%{opacity:.95} 50%{opacity:.85} 100%{opacity:.95} }

  .avatar-container {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    border: none; border-radius: 0; overflow: hidden;
    background: radial-gradient(circle at 50% 46%, rgba(0,255,157,0.10), rgba(0,0,0,0.14) 60%), rgba(0,0,0,0.20);
    box-shadow: inset 0 0 80px rgba(0,255,157,0.05);
    transition: box-shadow 0.8s ease;
    pointer-events: none;
  }
  .avatar-container.speaking { box-shadow: inset 0 0 120px rgba(0,255,157,0.16); }
  .avatar-container.sleeping { box-shadow: inset 0 0 60px rgba(0,255,157,0.02); }
  .avatar-container.greeting { box-shadow: inset 0 0 140px rgba(0,255,157,0.22); }

  canvas { display: block; width: 100%; height: 100%; border-radius: 0; cursor: pointer; touch-action: manipulation; }

  /* Subtitle (sottotitoli) */
  .subtitle {
    position: fixed; left: 50%; bottom: 11vh; transform: translateX(-50%);
    z-index: 11; max-width: 86vw; padding: 10px 22px;
    font-size: clamp(16px, 3.2vw, 30px); letter-spacing: 1px; line-height: 1.35; text-align: center;
    color: #eafff5; background: rgba(0,15,9,0.72);
    border: 1px solid rgba(0,255,157,0.35); border-radius: 12px;
    text-shadow: 0 0 12px rgba(0,255,136,0.8);
    box-shadow: 0 0 24px rgba(0,255,157,0.18);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .subtitle.show { opacity: 1; }

  /* Toast temporaneo (in basso) */
  .toast {
    position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%) translateY(10px);
    z-index: 15; font-size: clamp(11px, 1.5vw, 14px);
    color: #00ffaa; text-transform: uppercase; letter-spacing: 2px;
    background: rgba(0,20,11,0.85); border: 1px solid rgba(0,255,157,0.45);
    border-radius: 8px; padding: 8px 20px;
    text-shadow: 0 0 8px rgba(0,255,136,0.6);
    box-shadow: 0 0 22px rgba(0,255,157,0.18);
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease, transform 0.35s ease;
    max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.warn { color: #ffaa44; border-color: rgba(255,170,68,0.6); text-shadow: 0 0 8px rgba(255,170,68,0.6); }

  /* Menu Unificato (ESC) */
  #hotkey-menu {
    position: fixed; top: 20px; left: 20px; z-index: 30;
    background: rgba(0,15,9,0.94);
    border: 1px solid rgba(0,255,157,0.5);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    letter-spacing: 1px;
    line-height: 1.7;
    box-shadow: 0 0 30px rgba(0,255,157,0.25);
    max-width: 320px;
    display: none;
    flex-direction: column;
    gap: 4px;
  }
  #hotkey-menu.show { display: flex; }
  #hotkey-menu h3 {
    font-size: 11px;
    letter-spacing: 3px;
    color: #00ffaa;
    margin: 10px 0 4px 0;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(0,255,157,0.25);
    padding-bottom: 4px;
  }
  #hotkey-menu h3:first-child { margin-top: 0; }
  
  .menu-btn {
    display: flex; justify-content: space-between; align-items: center;
    background: transparent; border: 1px solid transparent;
    padding: 4px 8px; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 12px; letter-spacing: 1px;
    transition: all 0.15s;
  }
  .menu-btn:hover { background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.3); }
  .menu-btn .key {
    display: inline-block; min-width: 50px; padding: 2px 6px;
    border: 1px solid rgba(0,255,157,0.4); border-radius: 4px;
    text-align: center; font-weight: bold; color: #00ff88; background: rgba(0,255,136,0.06);
  }
  .menu-btn .label { color: rgba(0,255,157,0.65); }
  .menu-btn.active .key {
    background: rgba(0,255,136,0.35); border-color: #00ff88; color: #ffffff;
    box-shadow: 0 0 8px rgba(0,255,136,0.6);
  }
  .menu-btn.active .label { color: #00ffaa; }
  .menu-sep { border-top: 1px solid rgba(0,255,157,0.2); margin: 6px 0; }
  .menu-footer { font-size: 10px; opacity: 0.55; text-align: center; letter-spacing: 1.5px; margin-top: 6px; }
  .menu-link {
    display: block; font-size: 11px; color: #00ffaa; text-decoration: none;
    padding: 4px 8px; border-radius: 6px; word-break: break-all;
    transition: background 0.15s;
  }
  .menu-link:hover { background: rgba(0,255,136,0.1); }
  .menu-version { font-size: 11px; color: rgba(0,255,157,0.75); padding: 4px 8px; letter-spacing: 2px; }
</style>

<script>

const COLOR_MAIN = '#00ff88';
const COLOR_GLOW = 'rgba(0,255,136,0.8)';

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('avatarContainer');
const hotkeyMenuEl = document.getElementById('hotkey-menu');
const contextFileInput = document.getElementById('context-file-input');
const toastEl = document.getElementById('toast');
const subtitleEl = document.getElementById('subtitle');
const hkMicDebug = document.getElementById('hk-mic-debug');

// ============================================================
// HELPERS
// ============================================================
function rand(min, max) { return min + Math.random() * (max - min); }
function lerp(a, b, t) { return a + (b - a) * t; }
function isTypingInField() {
  const el = document.activeElement;
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
}
function basename(p) {
  if (!p) return '';
  const s = String(p);
  const i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'));
  return i >= 0 ? s.slice(i + 1) : s;
}

// --- Toast ---
let toastTimer = null;
function toast(msg, isWarn) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.toggle('warn', !!isWarn);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.classList.remove('show'); }, 2500);
}

// ============================================================
// RESPONSIVE
// ============================================================
let LW = 420, LH = 420;
function fitAvatar() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const S = (Math.min(w, h) / 420) * ZOOM;
  LW = w / S; LH = h / S;
  ctx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
}
window.addEventListener('resize', fitAvatar);
window.addEventListener('orientationchange', () => setTimeout(fitAvatar, 100));
fitAvatar();

// ============================================================
// STATE
// ============================================================
let currentMood = 'awake';
let moodStartTime = Date.now();
let moodDurationMs = 0;
let nextMicrosleepAt = Date.now() + rand(MOOD_CONFIG.microsleepMinMs, MOOD_CONFIG.microsleepMaxMs);
let nextYawnAt = Date.now() + rand(MOOD_CONFIG.yawnMinMs, MOOD_CONFIG.yawnMaxMs);
let nextExpressionAt = Date.now() + rand(MOOD_CONFIG.expressionMinMs, MOOD_CONFIG.expressionMaxMs);
let nextSelfTalkAt = Date.now() + rand(MOOD_CONFIG.selfTalkMinMs, MOOD_CONFIG.selfTalkMaxMs);

let audioUnlocked = false;
let muted = false; // M spento di default
let aiMode = false;
let aiWithContext = false;
let aiTextInputOpen = false;
let aiProcessing = false;
let hotkeyMenuOpen = false;

let isSpeaking = false;
let mouthOpen = 0;
let targetMouthOpen = 0;
let time = 0;
let clickTargetX = 0;
let clickTargetY = 0;
let sleepZs = [];
let zSpawnTimer = 0;

let eyeBlink = 0;
let blinkPhase = 'idle';
let blinkPhaseTimer = 0;
let blinkCloseDuration = 4;
let blinkOpenDuration = 4;
let blinkPauseMin = 150;

let blinkWantsDouble = false;

let yawnActive = 0;
let yawnPhase = 0;
let mouthTwitchTimer = 0;
let mouthTwitchNextAt = rand(20, 60) * 60;
let mouthTwitchActive = 0;
let mouthTwitchPhase = 0;
let mouthTwitchDir = 1;
let browTwitchTimer = 0;
let browTwitchNextAt = rand(15, 45) * 60;
let browTwitchActive = 0;
let browTwitchPhase = 0;
let browTwitchAmount = 0;

let headDriftNextAt = 90 + Math.random() * 150;
let headDriftTarget = 0;
let headDriftCurrent = 0;
let pupilScale = 1;
let pupilScaleTarget = 1;
let pupilTimer = 0;
let pupilNextAt = 180 + Math.random() * 240;
let wanderActive = false;
let wanderTimer = 0;
let wanderNextAt = 120 + Math.random() * 180;
let wanderTargetX = 0, wanderTargetY = 0, wanderReturnTimer = 0;
let saccadeTimer = 0;
let saccadeNextAt = 15 + Math.random() * 25;
let saccadeX = 0, saccadeY = 0;
let saccadeTargetX = 0, saccadeTargetY = 0;
let reflectionTimer = 0;
let reflectionNextAt = 1500 + Math.random() * 1500;
let reflectionActive = 0;
let reflectionPhase = 0;
let reflectionTotalFrames = 180;
let breathPhaseA = 0, breathPhaseB = 0, breathPhaseC = 0;
let breathCycleTimer = 0;
let breathCycleDuration = 180 + Math.random() * 120;
let currentBreathOffset = 0;
let glitchTimer = 0;
let glitchNextAt = 600 + Math.random() * 1200;
let glitchIntensity = 0;
let eyeTargetX = 0, eyeTargetY = 0;
let eyeCurrentX = 0, eyeCurrentY = 0;
let mouseMovedTimer = 0;
let mouseIsActive = false;

let currentEmotion = { browAngle: 0, browHeight: 0, mouthCurve: 0, eyeOpen: 1, mouthWidth: 80, headTilt: 0 };
let targetEmotion = { ...currentEmotion };

let customAiContext = null;
let importedFileName = '';

let hoveredButtonId = null;
let canvasMouseX = -1, canvasMouseY = -1;

// ============================================================
// AUDIO
// ============================================================
let audioCtx = null;
function initAudioContext() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(freq, duration, volume, type, freqEnd) {
  if (!audioCtx || !AUDIO_CONFIG.enabled || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, t + duration);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(volume, t + 0.03);
  gain.gain.linearRampToValueAtTime(0, t + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + duration + 0.05);
}
function playChirp() {
  tone(720, 0.09, AUDIO_CONFIG.chirpVolume, 'sine', 620);
  setTimeout(() => tone(560, 0.12, AUDIO_CONFIG.chirpVolume, 'sine', 480), 95);
}
function playGreet() {
  tone(440, 0.07, AUDIO_CONFIG.greetVolume, 'sine');
  setTimeout(() => tone(660, 0.07, AUDIO_CONFIG.greetVolume, 'sine'), 80);
  setTimeout(() => tone(880, 0.13, AUDIO_CONFIG.greetVolume, 'sine', 820), 160);
}
function playYawn() {
  if (!audioCtx || !AUDIO_CONFIG.enabled || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.linearRampToValueAtTime(300, t + 0.45);
  osc.frequency.linearRampToValueAtTime(160, t + 1.0);
  filter.type = 'lowpass'; filter.frequency.value = 480;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(AUDIO_CONFIG.yawnVolume, t + 0.25);
  gain.gain.linearRampToValueAtTime(0, t + 1.0);
  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 1.05);
}

// ============================================================
// PARTICLES
// ============================================================
let particles = [];
class Particle {
  constructor() { this.reset(); this.y = Math.random() * LH; }
  reset() {
    this.x = Math.random() * LW; this.y = LH + 20;
    this.sizeBase = Math.random() * 2.5 + 0.5; this.size = this.sizeBase;
    this.speedBase = Math.random() * 0.4 + 0.2; this.speed = this.speedBase;
    this.alphaBase = Math.random() * 0.4 + 0.15; this.alpha = this.alphaBase;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = Math.random() * 0.02 + 0.008;
  }
  update(intensity) {
    this.speed = this.speedBase * (1 + intensity * 2.5);
    this.size = this.sizeBase * (1 + intensity * 1.5);
    this.alpha = Math.min(1, this.alphaBase * (1 + intensity * 2));
    this.wobble += this.wobbleSpeed * (1 + intensity * 2);
    this.y -= this.speed;
    this.x += Math.sin(this.wobble) * (0.4 + intensity * 1.5);
    if (this.y < -20) this.reset();
  }
  draw() {
    ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = COLOR_MAIN;
    ctx.shadowBlur = 6 + 10 * (this.size / this.sizeBase - 1); ctx.shadowColor = COLOR_MAIN;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}
for (let i = 0; i < 90; i++) particles.push(new Particle());

// ============================================================
// WAVES
// ============================================================
let waves = [];
let waveSpawnTimer = 0;
function spawnWave(baseAlpha, baseSpeed) {
  waves.push({ radius: 180, maxRadius: 260 + Math.random() * 60, alpha: baseAlpha, speed: baseSpeed + Math.random() * 0.6, width: 1.5 + Math.random() * 1 });
}
function updateWaves() {
  waveSpawnTimer++;
  const spawnInterval = isSpeaking ? 10 : (currentMood === 'sleeping' ? 130 : 55);
  const baseAlpha = isSpeaking ? 0.65 : (currentMood === 'sleeping' ? 0.12 : 0.30);
  const baseSpeed = isSpeaking ? 1.2 : (currentMood === 'sleeping' ? 0.35 : 0.65);
  if (waveSpawnTimer >= spawnInterval) { waveSpawnTimer = 0; spawnWave(baseAlpha, baseSpeed); }
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i]; w.radius += w.speed; w.alpha -= 0.010;
    if (w.alpha <= 0 || w.radius >= w.maxRadius) waves.splice(i, 1);
  }
}
function drawWaves(cx, cy) {
  waves.forEach(w => {
    ctx.save(); ctx.strokeStyle = COLOR_MAIN; ctx.globalAlpha = w.alpha; ctx.lineWidth = w.width;
    ctx.shadowBlur = 15; ctx.shadowColor = COLOR_GLOW;
    ctx.beginPath(); ctx.arc(cx, cy, w.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  });
}

// ============================================================
// SYLLABLES / WORDS / VOICES
// ============================================================
function getSyllables(text) {
  const words = text.toLowerCase().match(/[a-zàèéìòù]+/g) || [];
  const result = []; const vowels = 'aeiouàèéìòù';
  for (const word of words) {
    let cur = '';
    for (let i = 0; i < word.length; i++) {
      cur += word[i];
      const isV = vowels.includes(word[i]);
      const nextV = i + 1 < word.length && vowels.includes(word[i + 1]);
      if (isV && !nextV) { result.push(cur); cur = ''; }
    }
    if (cur) result.push(cur);
  }
  return result;
}
function extractWords(text) {
  const words = []; const regex = /[a-zA-ZàèéìòùÀÈÉÌÒÙ]+/g;
  let m;
  while ((m = regex.exec(text)) !== null) { words.push({ word: m[0].toLowerCase(), index: m.index }); }
  return words;
}

let selectedVoice = null;
function getBrowserSpeechLanguage() {
  return (navigator.languages && navigator.languages[0]) || navigator.language || document.documentElement.lang || 'it-IT';
}
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  const norm = s => (s || '').toLowerCase().replace(/_/g, '-');
  const browserLang = norm(getBrowserSpeechLanguage());
  const baseLang = browserLang.split('-')[0];

  let italianVoices = voices.filter(v => norm(v.lang).split('-')[0] === 'it');
  if (italianVoices.length > 0) {
    const maleKeywords = ['male', 'uomo', 'maschile', 'cosimo', 'diego', 'luca', 'paolo', 'roberto', 'andrea'];
    let maleVoice = italianVoices.find(v => {
      const name = (v.name || '').toLowerCase();
      return maleKeywords.some(k => name.includes(k));
    });
    if (maleVoice) return maleVoice;
    
    const femaleKeywords = ['female', 'donna', 'femminile', 'elsa', 'alice', 'federica', 'isabella'];
    let nonFemaleVoice = italianVoices.find(v => {
      const name = (v.name || '').toLowerCase();

let syllables = [];

function updateMouthAnimation() {
  if (currentMood === 'sleeping') { targetMouthOpen = 0.03 + Math.abs(Math.sin(time * 0.3)) * 0.02; return; }
  if (!isSpeaking) {
    let base = 0.02 + Math.abs(Math.sin(time * 0.6)) * 0.04;
    if (yawnActive > 0) base = Math.max(base, yawnActive * 0.9);
    targetMouthOpen = base; return;
  }
  syllableTimer++;

    if (currentSyllableIndex >= syllables.length) currentSyllableIndex = 0;
    const syl = syllables[currentSyllableIndex] || '';
    framesPerSyllable = 6 + Math.random() * 4 + Math.min(4, syl.length);
  }
  const syl = syllables[currentSyllableIndex] || '';
  let openness = 0.4;
  if (syl.includes('a')) openness = 1.0;
  else if (syl.includes('o')) openness = 0.9;
  else if (syl.includes('e')) openness = 0.75;
  else if (syl.includes('u')) openness = 0.6;
  else if (syl.includes('i')) openness = 0.5;
  else openness = 0.25;

function startBlink(double) {
  blinkPhase = 'closing'; blinkPhaseTimer = 0;
  blinkCloseDuration = 4 + Math.floor(Math.random() * 3); blinkOpenDuration = 4 + Math.floor(Math.random() * 3);
  blinkWantsDouble = !!double;
}
function updateBlink() {
  if (currentMood === 'sleeping') { eyeBlink = 0; return; }
  if (forcedBlinkQueue > 0 && blinkPhase === 'idle') { startBlink(false); forcedBlinkQueue--; }
  switch (blinkPhase) {
    case 'idle':
      blinkNextDelay++;
      if (blinkNextDelay >= blinkPauseMin) { blinkNextDelay = 0; startBlink(Math.random() < 0.2); }
      eyeBlink = lerp(eyeBlink, 0, 0.5); break;
    case 'closing':
      blinkPhaseTimer++; eyeBlink = Math.min(1, blinkPhaseTimer / blinkCloseDuration);
      if (blinkPhaseTimer >= blinkCloseDuration) { blinkPhase = 'opening'; blinkPhaseTimer = 0; } break;
    case 'opening':
      blinkPhaseTimer++; eyeBlink = Math.max(0, 1 - blinkPhaseTimer / blinkOpenDuration);
      if (blinkPhaseTimer >= blinkOpenDuration) {
        if (blinkWantsDouble) { blinkWantsDouble = false; blinkPhase = 'double-wait'; blinkPhaseTimer = 0; }
        else { blinkPhase = 'idle'; blinkNextDelay = 0; blinkPauseMin = 150 + Math.floor(Math.random() * 200); }
      } break;

      blinkPhaseTimer++; eyeBlink = 0;

}

const BTN_LAYOUT = {
  marginX: 24,
  marginY: 24,
  buttonW: 48,     // più larghi per far stare meglio le label
  buttonH: 42,
  gapY: 14,
  labelGap: 4,
  labelFontSize: 8, // leggermente più piccole
  letterFontSize: 16,
  radius: 7,
  importWidth: 110,
  importHeight: 24,
  importFontSize: 11,
  fileNameFontSize: 9
};

const BTN_LABELS = {
  A: 'ai-context',
  T: 'ai-text',
  L: 'read',
  S: 'subtitle',
  M: 'mute',
  N: 'listen'
};

function computeButtons() {
  const { marginX, marginY, buttonW, buttonH, gapY, radius, importWidth, importHeight } = BTN_LAYOUT;
  const list = [];
  const colHeight = buttonH * 3 + gapY * 2;
  const colTop = (LH - colHeight) / 2;
  
  const xL = marginX;
  ['A', 'T', 'L'].forEach((id, i) => {
    list.push({ id, x: xL, y: colTop + i * (buttonH + gapY), w: buttonW, h: buttonH, label: BTN_LABELS[id], radius });
  });
  
  const xR = LW - marginX - buttonW;
  ['S', 'M', 'N'].forEach((id, i) => {
    list.push({ id, x: xR, y: colTop + i * (buttonH + gapY), w: buttonW, h: buttonH, label: BTN_LABELS[id], radius });
  });
  
  list.push({ id: 'IMPORT', label: '📁 OPEN FILE', x: LW - marginX - importWidth, y: marginY, w: importWidth, h: importHeight, radius });
  return list;
}

function hitTestButtons(px, py) {
  const list = computeButtons();
  for (const b of list) {
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b.id;
  }
  return null;
}

function buttonIsActive(id) {
  if (id === 'A') return aiMode && aiWithContext;
  if (id === 'T') return aiMode && !aiWithContext;
  if (id === 'L') return readActive;
  if (id === 'S') return subtitlesOn;
  if (id === 'M') return muted;
  if (id === 'N') return micEnabled && micState === 'active';
  if (id === 'IMPORT') return customAiContext !== null;
  return false;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawCanvasButtons() {
  const list = computeButtons();
  const { buttonW, buttonH, gapY } = BTN_LAYOUT;
  
  // Disegna le linee guida verticali (effetto circuito)
  const colHeight = buttonH * 3 + gapY * 2;
  const colTop = (LH - colHeight) / 2;
  
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(BTN_LAYOUT.marginX + buttonW/2, colTop + buttonH/2);
  ctx.lineTo(BTN_LAYOUT.marginX + buttonW/2, colTop + colHeight - buttonH/2);
  ctx.moveTo(LW - BTN_LAYOUT.marginX - buttonW/2, colTop + buttonH/2);
  ctx.lineTo(LW - BTN_LAYOUT.marginX - buttonW/2, colTop + colHeight - buttonH/2);
  ctx.strokeStyle = 'rgba(0,255,136,0.15)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  list.forEach(b => {
    const active = buttonIsActive(b.id);
    const hover = hoveredButtonId === b.id;
    const isImport = b.id === 'IMPORT';
    
    ctx.save();
    // Sfondo e Bordo
    if (active) {
      ctx.fillStyle = 'rgba(0,255,136,0.35)';
      ctx.strokeStyle = '#00ff88';
      ctx.shadowBlur = 18; ctx.shadowColor = 'rgba(0,255,136,0.9)';
    } else if (hover) {
      ctx.fillStyle = 'rgba(0,255,136,0.15)';
      ctx.strokeStyle = 'rgba(0,255,136,0.85)';
      ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(0,255,136,0.6)';
    } else {
      ctx.fillStyle = 'rgba(0,25,12,0.6)';
      ctx.strokeStyle = 'rgba(0,255,136,0.4)';
      ctx.shadowBlur = 6; ctx.shadowColor = 'rgba(0,255,136,0.2)';
    }
    ctx.lineWidth = active ? 2 : 1.2;
    roundRect(b.x, b.y, b.w, b.h, b.radius);
    ctx.fill(); ctx.stroke();

    // Testo (Lettera o Label Import)
    ctx.shadowBlur = active ? 12 : 4;
    ctx.shadowColor = active ? 'rgba(0,255,136,1)' : 'rgba(0,255,136,0.4)';
    ctx.fillStyle = active ? '#ffffff' : (hover ? '#bfffe0' : 'rgba(0,255,157,0.85)');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    
    if (isImport) {
      ctx.font = `bold ${BTN_LAYOUT.importFontSize}px 'Courier New'`;
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 0.5);
    } else {
      ctx.font = `bold ${BTN_LAYOUT.letterFontSize}px 'Courier New'`;
      ctx.fillText(b.id, b.x + b.w / 2, b.y + b.h / 2 + 0.5);
    }
    ctx.restore();

    // Etichetta descrittiva sotto
    if (!isImport) {
      ctx.save();
      ctx.font = `${BTN_LAYOUT.labelFontSize}px 'Courier New'`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = active ? 'rgba(0,255,170,0.95)' : (hover ? 'rgba(0,255,157,0.8)' : 'rgba(0,255,157,0.5)');
      if (active) { ctx.shadowBlur = 6; ctx.shadowColor = 'rgba(0,255,136,0.6)'; }
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h + BTN_LAYOUT.labelGap);
      ctx.restore();
    }
  });

  // Nome file sotto IMPORT
  if (importedFileName) {
    const impBtn = list.find(b => b.id === 'IMPORT');
    if (impBtn) {
      ctx.save();
      ctx.font = `${BTN_LAYOUT.fileNameFontSize}px 'Courier New'`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(0,255,170,0.8)';
      ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,255,136,0.4)';

function enterState(state, durationMs) { currentMood = state; moodStartTime = Date.now(); moodDurationMs = durationMs || 0; }

function updateMoodState() {
  const now = Date.now();
  if (currentMood === 'awake') {
    if (aiMode) return;
    if (now >= nextMicrosleepAt) startMicrosleep();
    else if (now >= nextSelfTalkAt) startSelfTalk();
    else if (now >= nextYawnAt) triggerYawn();
    else if (now >= nextExpressionAt) cycleExpression();
  } else if (currentMood === 'sleeping') {
    if (now - moodStartTime >= moodDurationMs) wakeFromMicrosleep();
  } else if (currentMood === 'greeting') {
    if (now - moodStartTime >= moodDurationMs) enterState('awake', 0);
  }
}

function startMicrosleep() { const duration = rand(MOOD_CONFIG.microsleepDurationMinMs, MOOD_CONFIG.microsleepDurationMaxMs); enterState('sleeping', duration); nextMicrosleepAt = Date.now() + rand(MOOD_CONFIG.microsleepMinMs, MOOD_CONFIG.microsleepMaxMs); }
function wakeFromMicrosleep() { enterState('awake', 0); forcedBlinkQueue = 1; nextMicrosleepAt = Date.now() + rand(MOOD_CONFIG.microsleepMinMs, MOOD_CONFIG.microsleepMaxMs); nextYawnAt = Date.now() + rand(MOOD_CONFIG.yawnMinMs, MOOD_CONFIG.yawnMaxMs); }
function triggerYawn() { yawnActive = 0.01; yawnPhase = 0; playYawn(); nextYawnAt = Date.now() + rand(MOOD_CONFIG.yawnMinMs, MOOD_CONFIG.yawnMaxMs) * (breakCount > 0 ? 0.5 : 1); }

// SCHEDULED EVENTS
// ============================================================
let firedEvents = new Set();
let lastFiredDate = new Date().toDateString();

function checkScheduledEvents() {
  if (aiMode) return;
  const now = new Date(); const dateKey = now.toDateString();
  if (dateKey !== lastFiredDate) { firedEvents.clear(); lastFiredDate = dateKey; }
  const hh = now.getHours(); const mm = now.getMinutes();

}

  const vol = ev.volume === 'low' ? AUDIO_CONFIG.lowVolume : AUDIO_CONFIG.scheduledVolume;
  const safetyMs = ev.sequence ? Math.max(45000, ev.sequence.length * 3500) : 15000;
  const returnToAwake = () => { if (currentMood === 'talking') enterState('awake', 0); };

// LETTURA DA FILE (tasto L)
// ============================================================
const READ_FILE = 'audio_sourge.js';
const READ_CHUNK_MAX = 220;
const READ_SENTENCE_PAUSE_MS = 350;
const READ_PARAGRAPH_PAUSE_MS = 900;

function loadReadFile() {
  return new Promise((resolve, reject) => {
    if (customAiContext !== null) {
      resolve(customAiContext);
      return;
    }
    try { delete window.AUDIO_SOURGE; } catch (e) { window.AUDIO_SOURGE = undefined; }
    const sc = document.createElement('script'); sc.src = READ_FILE + '?t=' + Date.now();
    sc.onload = () => { sc.remove(); resolve(window.AUDIO_SOURGE); };
    sc.onerror = () => { sc.remove(); reject(new Error('file not found')); };
    document.head.appendChild(sc);
  });
}
function splitLong(str) {
  const out = [];
  while (str.length > READ_CHUNK_MAX) {
    let cut = Math.max(str.lastIndexOf(', ', READ_CHUNK_MAX), str.lastIndexOf(' ', READ_CHUNK_MAX));
    if (cut < 40) cut = READ_CHUNK_MAX;
    out.push(str.slice(0, cut + 1).trim()); str = str.slice(cut + 1).trim();
  }
  if (str) out.push(str); return out;
}
function readChunks(src) {
  if (src === undefined || src === null) return [];
  const paras = Array.isArray(src) ? src.map(String) : String(src).split(/\n\s*\n/);
  const out = [];
  paras.forEach(p => {
    const clean = p.replace(/\s+/g, ' ').trim();
    if (!clean) return;
    const sentences = clean.match(/[^.!?…]+[.!?…]+["'»”)\]]*\s*|[^.!?…]+$/g) || [clean];
    const mine = []; let cur = '';
    sentences.forEach(sn => {
      sn = sn.trim(); if (!sn) return;
      if (cur && (cur + ' ' + sn).length > READ_CHUNK_MAX) { mine.push(cur); cur = ''; }
      cur = cur ? cur + ' ' + sn : sn;
    });
    if (cur) mine.push(cur);
    const pieces = []; mine.forEach(m => splitLong(m).forEach(x => pieces.push(x)));
    pieces.forEach((text, k) => out.push({ text, pause: k === pieces.length - 1 ? READ_PARAGRAPH_PAUSE_MS : READ_SENTENCE_PAUSE_MS }));
  });
  return out;
}
function stopReading() {
  readActive = false; readSession++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  hideSubtitle(0); isSpeaking = false; targetMouthOpen = 0; activeEmotion = 'neutro';
  if (!aiMode && currentMood === 'talking') enterState('awake', 0);
  toast('📖 reading interrupted');
}
async function startReading() {
  if (readLoading) return;
  if (!('speechSynthesis' in window)) { toast('📖 voice not supported', true); return; }
  readLoading = true; toast('📖 loading ' + (importedFileName || READ_FILE) + '…');
  let src;
  try { src = await loadReadFile(); if (src === undefined && typeof AUDIO_SOURGE !== 'undefined') src = AUDIO_SOURGE; }
  catch (err) { readLoading = false; toast('📖 ' + READ_FILE + ' not found', true); return; }
  readLoading = false;
  const chunks = readChunks(src);
  if (!chunks.length) { toast('📖 file empty or missing window.AUDIO_SOURGE', true); return; }

  if (!audioUnlocked) { initAudioContext(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); audioUnlocked = true; }
  if (currentMood === 'sleeping') wakeFromMicrosleep();
  if (!aiMode) enterState('talking', 0);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  hideSubtitle(0); isSpeaking = false; targetMouthOpen = 0;
  readActive = true; const my = ++readSession;

  let i = 0;
  const next = () => {
    if (!readActive || my !== readSession) return;
    if (i >= chunks.length) { readActive = false; setTimeout(() => { if (!aiMode && currentMood === 'talking') enterState('awake', 0); toast('📖 end of reading'); }, 400); return; }
    const c = chunks[i++]; const watchdogMs = 15000 + c.text.length * 250;
    const watchdog = setTimeout(() => { if (readActive && my === readSession) speechSynthesis.cancel(); }, watchdogMs);
    speakText(c.text, AUDIO_CONFIG.readVolume, () => { clearTimeout(watchdog); if (!readActive || my !== readSession) return; setTimeout(next, c.pause); });
  };

function pointFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX = 0, clientY = 0;
  if (e && typeof e.clientX === 'number' && e.clientX !== 0) { clientX = e.clientX; clientY = e.clientY; }
  else if (e && e.touches && e.touches[0]) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else if (e && e.changedTouches && e.changedTouches[0]) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
  else { return null; }

    clientX, clientY,
    canvasX: (clientX - rect.left) / rect.width * LW,
    canvasY: (clientY - rect.top) / rect.height * LH

}

document.body.addEventListener('click', (e) => {

  handleInteraction(p ? p.clientX : window.innerWidth / 2, p ? p.clientY : window.innerHeight / 2);
}, true);

    const id = hitTestButtons(p.canvasX, p.canvasY);

// ============================================================
const BREAK_CONFIG = { firstAfterMs: 60 * 60 * 1000, repeatEveryMs: 30 * 60 * 1000, idleThresholdMs: 5 * 60 * 1000, gapResetMs: 3 * 60 * 1000, welcomeMinAwayMs: 5 * 60 * 1000, avoidBeforeEventMs: 3 * 60 * 1000, avoidAfterEventMs: 3 * 60 * 1000 };
const BREAK_LEVELS = [
  [ m => `sono ${m} minuti che lavori, stacca un po`, m => `stacca un po, la schiena ti ringrazia` ],
  [ m => `${m} minuti e ancora non ti muovi, stacca un po`, m => `ti avevo detto di staccare un po` ],
  [ m => `${m} minuti. complimenti, sei un eroe o un testone`, m => `il computer non scappa, tu invece ti stai fossilizzando` ],
  [ m => `ok, io ti ho avvisato`, m => `fai come vuoi, sono ${m} minuti, ma poi non lamentarti` ]
];
const WELCOME_PHRASES = { paused: ["bravo, finalmente hai staccato", "così mi piaci, hai fatto la pausa"], short: ["ce l'hai fatta a staccare", "ben tornato"], mid: ["finalmente, ti aspettavo", "ti eri perso?"], long: ["dov'eri finito?", "ero quasi preoccupato"] };

let workStart = Date.now(); let lastTick = Date.now(); let nextBreakAt = workStart + BREAK_CONFIG.firstAfterMs; let breakCount = 0; let idleDetectorOk = false; let idleSince = null; let welcomePending = null; let lastWelcomeAt = 0;

function pickFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function resetWork() { workStart = Date.now(); nextBreakAt = workStart + BREAK_CONFIG.firstAfterMs; breakCount = 0; }
function pickWelcome(mins, hadWarning) { if (hadWarning) return pickFrom(WELCOME_PHRASES.paused); if (mins < 15) return pickFrom(WELCOME_PHRASES.short); if (mins < 60) return pickFrom(WELCOME_PHRASES.mid); return pickFrom(WELCOME_PHRASES.long); }
function registerAbsence(awayMs) { const hadWarning = breakCount > 0; resetWork(); if (awayMs < BREAK_CONFIG.welcomeMinAwayMs) return; const now = Date.now(); if (now - lastWelcomeAt < 60000) return; lastWelcomeAt = now; welcomePending = { text: pickWelcome(Math.round(awayMs / 60000), hadWarning), at: now }; }
function nearScheduledEvent() { const now = Date.now(); const d = new Date(); for (const ev of SCHEDULED_EVENTS) { if (ev.active === false) continue; const t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), ev.h, ev.m, 0).getTime(); const diff = t - now; if (diff < BREAK_CONFIG.avoidBeforeEventMs && diff > -BREAK_CONFIG.avoidAfterEventMs) return true; } return false; }
function cannotSpeakReason() { if (!audioUnlocked) return 'audio not unlocked (tap once)'; if (document.hidden) return 'page hidden'; if (currentMood === 'talking') return 'already talking'; if (currentMood === 'sleeping') return 'sleeping'; if (nearScheduledEvent()) return 'near a scheduled event'; return ''; }
function canSpeakNow() { return !cannotSpeakReason(); }

async function startIdleDetection() { if (!('IdleDetector' in window) || idleDetectorOk) return; try { if (await IdleDetector.requestPermission() !== 'granted') return; const det = new IdleDetector(); det.addEventListener('change', () => { const away = det.userState === 'idle' || det.screenState === 'locked'; if (away && idleSince === null) { idleSince = Date.now() - (det.screenState === 'locked' ? 0 : BREAK_CONFIG.idleThresholdMs); } else if (!away && idleSince !== null) { const awayMs = Date.now() - idleSince; idleSince = null; registerAbsence(awayMs); } }); await det.start({ threshold: BREAK_CONFIG.idleThresholdMs }); idleDetectorOk = true; } catch (e) {} }
function checkBreak() {
  if (aiMode) return;
  const now = Date.now();
  if (now - lastTick > BREAK_CONFIG.gapResetMs) registerAbsence(now - lastTick);
  lastTick = now;
  if (welcomePending) { if (now - welcomePending.at > 2 * 60 * 1000) { welcomePending = null; } else if (canSpeakNow()) { const text = welcomePending.text; welcomePending = null; fireScheduledEvent({ text }); return; } }
  if (idleSince !== null) return;
  if (now < nextBreakAt || !canSpeakNow()) return;
  const mins = Math.round((now - workStart) / 60000); const level = Math.min(breakCount, BREAK_LEVELS.length - 1); const phrase = pickFrom(BREAK_LEVELS[level])(mins);
  breakCount++; nextBreakAt = now + BREAK_CONFIG.repeatEveryMs; fireScheduledEvent({ text: phrase });
}
setInterval(checkBreak, 15000);

// ============================================================
// MICROFONO
// ============================================================
const MIC_CONFIG = { calibrationMs: 2500, voiceRatio: 2.8, voiceMin: 0.007, listenAfterMs: 700, burstGapMs: 450, voiceReplyChance: 0.5, voiceReplyMinMs: 700, voiceReplyCooldownMs: 20000, speakVolume: 0.4, spikeRatio: 5, minLevel: 0.04, spikeMaxMs: 600, crestMin: 8, loudMult: 1.3, cooldownMs: 5000, speakChance: 0.35, silenceBoostAfterMs: 5 * 60 * 1000 };

let micEnabled = false; let micStream = null, micSource = null, micAnalyser = null, micBuf = null;
let micStarting = false, micAsked = false; let micStartedAt = 0, micFloor = 0;
let lastMicReactAt = 0, lastSoundAt = Date.now(), silenceBoosted = false;
let micDebug = false, micLevel = 0, micState = 'off';
let burstStart = 0, burstLastLoud = 0, burstPeak = 0, micListenUntil = 0, micListening = false, lastVoiceReplyAt = 0;
let micLastEvent = '—', micIgnore = ''; let burstMaxCrest = 0, micCrest = 0, micLastTickAt = Date.now();

try {
  const stored = localStorage.getItem('avatar_mic');
  if (stored === '1') micEnabled = true; else micEnabled = false;
} catch (e) { micEnabled = false; }

async function startMic(force) {
  if (aiMode) return; if (!micEnabled || micStream || micStarting) return; if (micAsked && !force) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { micState = 'not supported (need https or localhost)'; toast('🎙 mic not supported', true); return; }
  micStarting = true; micState = 'requesting permission'; micAsked = true;
  try {
    initAudioContext(); if (!audioCtx) return; if (audioCtx.state === 'suspended') audioCtx.resume();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    if (!micEnabled || aiMode) { stream.getTracks().forEach(t => t.stop()); return; }
    micStream = stream; micSource = audioCtx.createMediaStreamSource(stream); micAnalyser = audioCtx.createAnalyser();
    micAnalyser.fftSize = 1024; micBuf = new Float32Array(micAnalyser.fftSize); micSource.connect(micAnalyser);
    micStartedAt = Date.now(); micFloor = 0; lastSoundAt = Date.now(); stream.getAudioTracks()[0].addEventListener('ended', stopMic);
    micState = 'active';
  } catch (e) { micState = 'error: ' + (e && e.name ? e.name : 'unknown'); toast('🎙 mic unavailable (' + (e && e.name ? e.name : '?') + ')', true); } finally { micStarting = false; }
}
function stopMic() { micState = 'off'; if (micStream) micStream.getTracks().forEach(t => t.stop()); if (micSource) { try { micSource.disconnect(); } catch (e) {} } micStream = null; micSource = null; micAnalyser = null; micBuf = null; }
function micSpeak(text) { enterState('talking', 0); speakText(text, MIC_CONFIG.speakVolume, () => { setTimeout(() => { if (currentMood === 'talking') enterState('awake', 0); }, 400); }); setTimeout(() => { if (currentMood === 'talking') { stopSpeaking(); enterState('awake', 0); } }, 6000); }
function micReact() { const now = Date.now(); if (now - lastMicReactAt < MIC_CONFIG.cooldownMs) { micLastEvent += ' → cooldown'; return; } lastMicReactAt = now; if (currentMood === 'sleeping') wakeFromMicrosleep(); forcedBlinkQueue = Math.max(forcedBlinkQueue, 1); if (Math.random() < MIC_CONFIG.speakChance && canSpeakNow()) micSpeak(pickFrom(MIC_PHRASES)); activeEmotion = 'sorpreso'; emotionHoldFrames = 120; }
function endBurst(now, spikeThr) {
  const dur = Math.round(burstLastLoud - burstStart); const peak = burstPeak; const crest = burstMaxCrest;
  burstStart = 0; burstPeak = 0; burstMaxCrest = 0;
  const info = dur + 'ms peak ' + peak.toFixed(3) + ' crest ' + crest.toFixed(1);
  if (dur < MIC_CONFIG.spikeMaxMs && peak > spikeThr && (crest >= MIC_CONFIG.crestMin || peak > spikeThr * MIC_CONFIG.loudMult)) { micLastEvent = 'spike ' + info; micReact(); return; }
  if (dur >= MIC_CONFIG.listenAfterMs && dur < 45000) {
    micLastEvent = 'voice ' + info; micListenUntil = now + 1500; if (currentMood === 'sleeping') wakeFromMicrosleep();
    if (dur >= MIC_CONFIG.voiceReplyMinMs) {
      const sinceReply = now - lastVoiceReplyAt; let why = '';
      if (sinceReply <= MIC_CONFIG.voiceReplyCooldownMs) why = 'cooldown ' + Math.ceil((MIC_CONFIG.voiceReplyCooldownMs - sinceReply) / 1000) + 's';
      else if (Math.random() >= MIC_CONFIG.voiceReplyChance) why = 'not selected (probability)';
      else why = cannotSpeakReason();
      if (why) micLastEvent += ' → no reply: ' + why;
      else { lastVoiceReplyAt = now; micSpeak(pickFrom(VOICE_REPLIES)); micLastEvent += ' → replies'; }
    }
    return;
  }
  micLastEvent = 'ignored: ' + info;
}
function micTick() {
  if (!micAnalyser) return; if (aiMode) return; if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  micAnalyser.getFloatTimeDomainData(micBuf);
  let sum = 0, peak = 0;
  for (let i = 0; i < micBuf.length; i++) { const v = micBuf[i]; sum += v * v; const a = v < 0 ? -v : v; if (a > peak) peak = a; }
  const rmsRaw = Math.sqrt(sum / micBuf.length); micCrest = rmsRaw > 0.0005 ? peak / rmsRaw : 0;
  const rms = Math.max(rmsRaw, peak * 0.4); micLevel = rms;
  const now = Date.now(); const dt = Math.min(200, now - micLastTickAt); micLastTickAt = now;
  if (now - micStartedAt < MIC_CONFIG.calibrationMs) { micFloor = micFloor === 0 ? rms : lerp(micFloor, rms, Math.min(1, dt / 400)); return; }
  const reason = (isSpeaking || currentMood === 'talking') ? 'talking' : currentMood === 'greeting' ? 'greeting (5s after tap)' : yawnActive > 0 ? 'yawn' : (now - lastSpeechEnd < 1000) ? 'echo of own voice' : '';
  if (reason) { micIgnore = reason; burstStart = 0; burstPeak = 0; micListening = false; return; }
  micIgnore = '';
  const voiceThr = Math.max(micFloor * MIC_CONFIG.voiceRatio, MIC_CONFIG.voiceMin); const spikeThr = Math.max(micFloor * MIC_CONFIG.spikeRatio, MIC_CONFIG.minLevel);
  if (rms < micFloor) micFloor += (rms - micFloor) * Math.min(1, dt / 1200); else if (!burstStart || now - burstStart > 20000) micFloor += (rms - micFloor) * Math.min(1, dt / 20000);
  if (rms > voiceThr) { if (!burstStart) { burstStart = now; burstPeak = 0; burstMaxCrest = 0; } burstLastLoud = now; if (rms > burstPeak) burstPeak = rms; if (micCrest > burstMaxCrest) burstMaxCrest = micCrest; lastSoundAt = now; silenceBoosted = false; }
  else if (burstStart && now - burstLastLoud > MIC_CONFIG.burstGapMs) { endBurst(now, spikeThr); }
  micListening = (burstStart > 0 && now - burstStart >= MIC_CONFIG.listenAfterMs && now - burstStart < 45000) || now < micListenUntil;
  if (!silenceBoosted && now - lastSoundAt > MIC_CONFIG.silenceBoostAfterMs) { silenceBoosted = true; nextYawnAt = Math.min(nextYawnAt, now + rand(20000, 60000)); nextMicrosleepAt = Math.min(nextMicrosleepAt, now + rand(60000, 180000)); }
}
setInterval(micTick, 15);

function drawMicDebug() {
  if (!micDebug) return;
  const x = 39, y = LH - 130; const voiceThr = Math.max(micFloor * MIC_CONFIG.voiceRatio, MIC_CONFIG.voiceMin); const spikeThr = Math.max(micFloor * MIC_CONFIG.spikeRatio, MIC_CONFIG.minLevel);
  ctx.save(); ctx.shadowBlur = 0; ctx.font = '10px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(0,255,157,0.9)';
  ctx.fillText('MIC: ' + micState + ' | ctx: ' + (audioCtx ? audioCtx.state : 'n/a') + (micListening ? ' | LISTENING' : '') + (aiMode ? ' | AI' : ''), x, y);
  ctx.fillText('lvl ' + micLevel.toFixed(3) + '  floor ' + micFloor.toFixed(3) + '  crest ' + micCrest.toFixed(1), x, y + 14);
  ctx.fillText('voice ' + voiceThr.toFixed(3) + '  spike ' + spikeThr.toFixed(3), x, y + 26);
  ctx.fillText('event: ' + micLastEvent, x, y + 38);
  if (micIgnore) { ctx.fillStyle = '#ffaa44'; ctx.fillText('ignore: ' + micIgnore, x, y + 50); ctx.fillStyle = 'rgba(0,255,157,0.9)'; }
  const W = 180, H = 6, scale = W / Math.max(spikeThr * 2, 0.05);
  ctx.strokeStyle = 'rgba(0,255,157,0.6)'; ctx.lineWidth = 1;
  ctx.strokeRect(x, y + 58, W, H); ctx.fillRect(x, y + 58, Math.min(W, micLevel * scale), H);
  ctx.fillStyle = '#ffcc44'; ctx.fillRect(x + Math.min(W, voiceThr * scale), y + 55, 2, H + 6);
  ctx.fillStyle = '#ff6644'; ctx.fillRect(x + Math.min(W, spikeThr * scale), y + 55, 2, H + 6);
  ctx.restore();
}

// ============================================================
// MODALITÀ AI
// ============================================================
let aiContext = ''; let aiContextLoaded = false; let aiHistory = [];

async function loadAiContext() {
  if (aiContextLoaded) return;
  try {
    const src = customAiContext !== null ? customAiContext : await loadReadFile();
    if (typeof src === 'string') aiContext = src;
    else if (Array.isArray(src)) aiContext = src.map(String).join('\n\n');
    else aiContext = '';
    aiContextLoaded = true;
  } catch (e) { aiContext = ''; aiContextLoaded = true; console.warn('audio_sourge.js not loaded, AI mode without context'); }
}

async function askGemini(userText) {
  if (aiProcessing) return;
  if (!PROXY_BASE_URL || PROXY_BASE_URL.includes('IL_TUO_INDIRIZZO')) { toast('🔑 configure proxy URL in code', true); return; }

  aiProcessing = true; enterState('talking', 0); showSubtitle('…');
  aiHistory.push({ role: 'user', parts: [{ text: userText }] });

  let systemText;
  if (aiWithContext && aiContext) {
    systemText = `Sei un assistente che risponde a domande basandosi esclusivamente sul materiale fornito qui sotto.

REGOLE (hanno priorità su tutto il resto):
- Rispondi solo ed esclusivamente in base al materiale.
- Se la risposta non è nel materiale, dillo chiaramente senza inventare.
- Non aggiungere opinioni, battute, commenti personali o informazioni esterne.
- Tono neutro, chiaro e professionale. Nessun sarcasmo, nessuna battuta.
- Rispondi in italiano, in modo conciso (massimo 3-4 frasi).

--- INIZIO MATERIALE ---
${aiContext}
--- FINE MATERIALE ---`;
  } else { systemText = GEMINI_SYSTEM_PROMPT; }

  const url = `${PROXY_BASE_URL}/gemini/v1beta/models/${GEMINI_MODEL}:generateContent`;

  try {
    const response = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system_instruction: { parts: [{ text: systemText }] }, contents: aiHistory, generationConfig: { temperature: 0.7, maxOutputTokens: 300 } })
    });
    const data = await response.json();
    if (!response.ok) { const msg = (data && data.error && data.error.message) || 'API error'; throw new Error(msg); }
    const reply = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || '…';
    aiHistory.push({ role: 'model', parts: [{ text: reply }] });
    aiProcessing = false;
    speakText(reply, 0.9, () => {
      setTimeout(() => {
        if (aiMode) enterState('awake', 0);
      }, 500);
    });
  } catch (err) {
    aiProcessing = false; aiHistory.pop(); console.error('Gemini error:', err);
    showSubtitle('⚠ ' + err.message); hideSubtitle(3000); toast('⚠ ' + err.message, true);
    setTimeout(() => { if (aiMode) enterState('awake', 0); }, 2000);
  }
}

async function enterAiMode(withContext) {
  if (aiMode) exitAiMode(true);
  aiMode = true; aiWithContext = !!withContext; stopSpeaking(); stopMic();
  enterState('awake', 0); document.body.classList.add('ai-mode'); aiHistory = [];

  if (aiWithContext) {
    toast('📖 loading context…'); await loadAiContext();
    if (aiContext) { toast('📖 context loaded'); }
    else { aiWithContext = false; toast('📖 audio_sourge.js not found, no-context mode', true); }
  }
  openAiTextInput();
}

function exitAiMode(silent) {
  aiMode = false; aiWithContext = false; stopSpeaking(); aiTextInputOpen = false; closeAiTextInput(); aiHistory = [];
  document.body.classList.remove('ai-mode');
  if (micEnabled) startMic(false);
  if (!silent) toast('🤖 AI mode off');
}

function openAiTextInput() {
  if (aiTextInputOpen) return;
  aiTextInputOpen = true;
  const wrap = document.createElement('div');
  wrap.id = 'ai-input-wrap';
  wrap.style.cssText = `position: fixed; left: 50%; bottom: 20vh; transform: translateX(-50%); z-index: 20; width: min(80vw, 700px); display: flex; gap: 8px; background: rgba(0,15,9,0.9); border: 1px solid rgba(0,255,157,0.5); border-radius: 10px; padding: 10px; box-shadow: 0 0 30px rgba(0,255,157,0.25);`;
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = aiWithContext ? 'Ask about the file… (Enter to send, Esc to close)' : 'Write to CB-01… (Enter to send, Esc to close)';
  input.style.cssText = `flex: 1; background: rgba(0,0,0,0.5); color: #00ff88; border: 1px solid rgba(0,255,157,0.3); border-radius: 6px; padding: 10px 12px; font-family: inherit; font-size: 15px; outline: none;`;
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim()) { const t = input.value.trim(); input.value = ''; closeAiTextInput(); askGemini(t); }
    else if (e.key === 'Escape') { e.stopPropagation(); closeAiTextInput(); }
  });
  wrap.appendChild(input); document.body.appendChild(wrap); input.focus();
}

function closeAiTextInput() { aiTextInputOpen = false; const el = document.getElementById('ai-input-wrap'); if (el) el.remove(); }

// ============================================================
// MENU & INTERFACCIA
// ============================================================
function updateHotkeyMenu() {
  hkMicDebug.classList.toggle('active', micDebug);
}
function openHotkeyMenu() { hotkeyMenuOpen = true; updateHotkeyMenu(); hotkeyMenuEl.classList.add('show'); }
function closeHotkeyMenu() { hotkeyMenuOpen = false; hotkeyMenuEl.classList.remove('show'); }

// ============================================================
// GESTIONE IMPORTAZIONE FILE
// ============================================================
contextFileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    let extracted = text;
    if (/\.m?js$/i.test(file.name)) {
      try {
        const fake = {};
        new Function('window', text)(fake);
        if (typeof fake.AUDIO_SOURGE === 'string') extracted = fake.AUDIO_SOURGE;
        else if (Array.isArray(fake.AUDIO_SOURGE)) extracted = fake.AUDIO_SOURGE.join('\n\n');
      } catch (err) { /* usa testo grezzo */ }
    }
    customAiContext = extracted;
    importedFileName = basename(file.name);
    aiContext = ''; aiContextLoaded = false; aiHistory = [];
    toast('📄 context imported: ' + importedFileName);
    updateHotkeyMenu();
    contextFileInput.value = '';
    closeHotkeyMenu();
  } catch (err) {
    toast('⚠ ' + err.message, true);
  }
});

// ============================================================
// TASTI (Desktop)
// ============================================================
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.key === 'a' || e.key === 'A') { e.preventDefault(); if (aiMode && aiWithContext) exitAiMode(); else enterAiMode(true); }
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.key === 't' || e.key === 'T') { e.preventDefault(); if (aiMode && !aiWithContext) exitAiMode(); else enterAiMode(false); }
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.key !== 'Backspace' && e.key !== 'ArrowLeft') return;
  e.preventDefault();
  if (!aiMode) { enterAiMode(false); return; }
  if (aiTextInputOpen) closeAiTextInput(); else openAiTextInput();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return; if (isTypingInField()) return;
  if (hotkeyMenuOpen) { closeHotkeyMenu(); return; } openHotkeyMenu();
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return; if ((e.key !== 'l' && e.key !== 'L') || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (readActive) stopReading(); else startReading();
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return; if ((e.key !== 'm' && e.key !== 'M') || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  muted = !muted;
  if (muted) { stopSpeaking(); toast('🔇 muted'); }
  else { toast('🔊 audio on'); }
  try { localStorage.setItem('avatar_muted', muted ? '1' : '0'); } catch (err) {}
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return; if ((e.key !== 's' && e.key !== 'S') || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  subtitlesOn = !subtitlesOn; try { localStorage.setItem('avatar_subs', subtitlesOn ? '1' : '0'); } catch (err) {}
  if (subtitlesOn && currentSubtitle) showSubtitle(currentSubtitle); else if (!subtitlesOn) subtitleEl.classList.remove('show');
  toast(subtitlesOn ? '💬 subtitles on' : '💬 subtitles off');
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return; if ((e.key !== 'd' && e.key !== 'D') || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return; micDebug = !micDebug; updateHotkeyMenu();
});
document.addEventListener('keydown', (e) => {
  if (isTypingInField()) return; if ((e.key !== 'n' && e.key !== 'N') || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  micEnabled = !micEnabled; try { localStorage.setItem('avatar_mic', micEnabled ? '1' : '0'); } catch (err) {}
  if (micEnabled) { micAsked = false; startMic(true); toast('🎙 mic on'); }
  else { stopMic(); toast('🎙 mic off'); }
});

// ============================================================
// AZIONI PULSANTI MENU
// ============================================================
hkMicDebug.addEventListener('click', (e) => {
  e.stopPropagation(); micDebug = !micDebug; updateHotkeyMenu(); closeHotkeyMenu();
});

document.body.addEventListener('click', (e) => {
  if (hotkeyMenuOpen && !e.target.closest('#hotkey-menu')) {
    closeHotkeyMenu();
  }
});

// ============================================================
// STARTUP
// ============================================================
// Forza l'avvio senza muto (ignora localStorage)
try { localStorage.removeItem('avatar_muted'); } catch (e) {}
muted = false;

enterState('awake', 0);
setInterval(checkScheduledEvents, 5000); checkScheduledEvents();

function renderLoop() { drawAvatar(); requestAnimationFrame(renderLoop); }
renderLoop();
</script>
